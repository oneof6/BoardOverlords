<script>
'use strict';
/* ============================================================== Tests ==== */
const Tests = {
  run() {
    const results = []; const t0 = performance.now();
    const T = (name, fn) => { try { fn(); results.push({ name, ok: true }); } catch (e) { results.push({ name, ok: false, err: e.message }); } };
    const eq = (a, b, m = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${m} expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); };
    const ok = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };
    const near = (a, b, e = 1e-9, m = '') => { if (Math.abs(a - b) > e) throw new Error(`${m} expected ≈${b}, got ${a}`); };
    const fresh = () => freshState();
    const asSession = (st, deploy = 'manual') => BattleState.create({ ruleset: 'as', friendlyForceId: 'force-demo-as-friendly', enemyForceId: 'force-demo-as-enemy', map: { width: 48, height: 36, unit: 'in' }, deploy }, st);
    const cbtSession = (st, deploy = 'auto') => BattleState.create({ ruleset: 'classic', friendlyForceId: 'force-demo-cbt-friendly', enemyForceId: 'force-demo-cbt-enemy', map: { width: 32, height: 17, unit: 'hex' }, deploy }, st);

    /* --- schema & validation --- */
    T('Demo units pass validation (no errors)', () => { fresh().units.forEach(u => eq(Schema.validateUnit(u).errors, [], u.id)); });
    T('Invalid unit reports readable errors', () => { const v = Schema.validateUnit({ id: 'x', alphaStrike: { pv: 'ten', damage: { s: 1, m: 1 }, armor: 1, structure: 1, move: [] } }); ok(v.errors.some(e => /name/.test(e)), 'name'); ok(v.errors.some(e => /pv/.test(e)), 'pv'); ok(v.errors.some(e => /damage/.test(e)), 'damage'); ok(v.errors.some(e => /move/.test(e)), 'move'); });
    T('Unit without profiles gives a warning, not an error', () => { const v = Schema.validateUnit({ id: 'x', name: 'X' }); eq(v.errors, []); ok(v.warnings.length === 1); });
    T('Classic profile requires armor/internal per location', () => { const u = U.clone(fresh().units[0]); delete u.classic.armor.LA; ok(Schema.validateUnit(u).errors.some(e => /armor\.LA/.test(e))); });
    T('Force validation catches bad ruleset and qty', () => { const v = Schema.validateForce({ id: 'f', name: 'F', ruleset: 'xx', entries: [{ unitId: 'a', qty: 0 }] }); ok(v.errors.length === 2, JSON.stringify(v.errors)); });
    T('Unrecognised bundle is reported', () => { ok(Schema.readBundle({ foo: 1 }).errors.length === 1); ok(Schema.readBundle('x').errors.length === 1); });
    T('Newer schema version is rejected with a message', () => { ok(Schema.readBundle({ type: 'mechops-units', schemaVersion: 99, units: [] }).errors.some(e => /schema version 99/.test(e))); });

    /* --- forces --- */
    T('AS force totals: PV and unit count', () => { const st = fresh(); const tt = Forces.totals(st.forces.find(f => f.id === 'force-demo-as-friendly'), st.units); eq(tt.pv, 105); eq(tt.count, 4); });
    T('Quantity and PV override affect totals', () => { const st = fresh(); const f = U.clone(st.forces[0]); f.entries[0].qty = 2; f.entries[1].pvOverride = 10; const tt = Forces.totals(f, st.units); eq(tt.pv, 105 + 28 - 30 + 10); eq(tt.count, 5); });
    T('Classic force tonnage totals', () => { const st = fresh(); eq(Forces.totals(st.forces.find(f => f.id === 'force-demo-cbt-friendly'), st.units).tonnage, 105); });
    T('Limits warn without blocking', () => { const st = fresh(); const f = U.clone(st.forces[0]); f.limits.pv = 100; f.limits.units = 3; const w = Forces.limitWarnings(f, Forces.totals(f, st.units)); eq(w.length, 2); eq(f.entries.length, 4); });
    T('Units lacking ruleset data are flagged in totals', () => { const st = fresh(); const f = Forces.newForce('classic', 'enemy'); f.entries.push(Forces.newEntry('demo-grubline-hover')); ok(Forces.totals(f, st.units).missing.length === 1); });
    T('Clone force gets new ids', () => { const st = fresh(); const c = Forces.cloneForce(st.forces[0]); ok(c.id !== st.forces[0].id); ok(c.entries[0].id !== st.forces[0].entries[0].id); eq(c.entries.length, 4); });

    /* --- import / export --- */
    T('Force export → import round trip keeps all fields', () => {
      const src = fresh(); const f = src.forces[1]; f.entries[0].customField = 'kept'; const bundle = JSON.parse(JSON.stringify(Forces.exportBundle(f, src.units)));
      const dst = fresh(); dst.units = []; dst.forces = [];
      const an = Importer.analyze(bundle, dst); eq(an.items.filter(i => i.errors.length).length, 0); const r = Importer.apply(an, 'merge', dst);
      eq(r.added, 1 + bundle.units.length); eq(dst.forces[0], bundle.force); eq(dst.units.length, 4); eq(dst.forces[0].entries[0].customField, 'kept');
    });
    T('Duplicate detection with skip / replace / merge', () => {
      const st = fresh(); const u = U.clone(st.units[0]); u.name = u.name; u.extra = 'x'; u.alphaStrike.pv = 99;
      const b = { type: 'mechops-units', units: [u] };
      let an = Importer.analyze(b, st); ok(an.items[0].conflict, 'conflict detected');
      Importer.apply(an, 'skip', st); eq(st.units[0].alphaStrike.pv, 14);
      an = Importer.analyze(b, st); Importer.apply(an, 'merge', st); eq(st.units[0].alphaStrike.pv, 99); eq(st.units[0].extra, 'x');
      const st2 = fresh(); const u2 = U.clone(u); delete u2.extra; st2.units[0].keepMe = 1; an = Importer.analyze({ type: 'mechops-units', units: [u2] }, st2); Importer.apply(an, 'replace', st2); ok(st2.units[0].keepMe === undefined, 'replace drops old fields');
    });
    T('Same name/variant with different id is treated as duplicate and re-pointed', () => {
      const st = fresh(); const u = U.clone(st.units[2]); u.id = 'other-id'; const f = Forces.newForce('as', 'friendly'); f.entries.push(Forces.newEntry('other-id'));
      const an = Importer.analyze({ type: 'mechops-force', force: f, units: [u] }, st); Importer.apply(an, 'skip', st);
      eq(st.forces[st.forces.length - 1].entries[0].unitId, st.units[2].id);
    });
    T('Invalid items are not imported', () => { const st = fresh(); const n = st.units.length; const an = Importer.analyze([{ id: 'bad' }], st); const r = Importer.apply(an, 'merge', st); eq(r.invalid, 1); eq(st.units.length, n); });

    /* --- probability & geometry --- */
    T('P(2D6 ≥ N) exact values', () => { near(Prob.p2d6AtLeast(2), 1); near(Prob.p2d6AtLeast(7), 21 / 36); near(Prob.p2d6AtLeast(12), 1 / 36); near(Prob.p2d6AtLeast(13), 0); let tot = 0; for (let n = 2; n <= 12; n++) tot += Prob.ways2d6AtLeast(n) - Prob.ways2d6AtLeast(n + 1); eq(tot, 36); });
    T('Dice roller returns values 1–6', () => { const r = U.rng(5); for (let i = 0; i < 200; i++) Prob.roll(2, r).forEach(d => ok(d >= 1 && d <= 6)); });
    T('Hex distance on offset grid', () => { eq(Geo.hexDistance({ x: 0, y: 0 }, { x: 0, y: 3 }), 3); eq(Geo.hexDistance({ x: 0, y: 0 }, { x: 3, y: 0 }), 3); eq(Geo.hexDistance({ x: 0, y: 0 }, { x: 1, y: 0 }), 1); eq(Geo.hexDistance({ x: 0, y: 0 }, { x: 1, y: 1 }), 2); eq(Geo.hexDistance({ x: 2, y: 2 }, { x: 5, y: 4 }), 4); });
    T('Map distance: inches and hexless conversion', () => { const st = fresh(); const s = asSession(st); const [a, b] = s.units; a.pos = { x: 0, y: 0 }; b.pos = { x: 6, y: 8 }; eq(BattleState.mapDistance(s, a, b, st), 10); const c = { ruleset: 'classic', map: { unit: 'in' } }; eq(BattleState.mapDistance(c, a, b, st), 5); });
    T('Arc approximation (front / rear)', () => { const s = { map: { unit: 'in' } }; const a = { pos: { x: 10, y: 10 }, facing: 0 }; eq(BattleState.arc(s, a, { pos: { x: 10, y: 2 } }), 'front'); eq(BattleState.arc(s, a, { pos: { x: 10, y: 20 } }), 'rear'); eq(BattleState.arc(s, a, { pos: { x: 20, y: 10 } }), 'side'); });

    /* --- rules adapters --- */
    T('AS range bands from distance', () => { const st = fresh(); const A = RulesAdapterAlphaStrike; eq([6, 6.5, 24, 25, 42, 43].map(d => A.band(d, st)), ['s', 'm', 'm', 'l', 'l', 'e']); });
    T('AS damage after weapon hits never below 0; "0*" uses setting', () => { const st = fresh(); const s = asSession(st); const u = s.units.find(x => x.unitId === 'demo-halberdier-hb4'); eq(RulesAdapterAlphaStrike.dmgAt(u, 's', st), 3); u.as.crits.weapons = 1; eq(RulesAdapterAlphaStrike.dmgAt(u, 's', st), 2); u.as.crits.weapons = 9; eq(RulesAdapterAlphaStrike.dmgAt(u, 'l', st), 0); eq(Units.asDamage('0*', st.settings), 0.5); });
    T('AS overheat only at S/M (or L with OVL)', () => { const st = fresh(); const s = asSession(st); const u = s.units.find(x => x.unitId === 'demo-halberdier-hb4'); eq(RulesAdapterAlphaStrike.attack(u, u, 10, { overheat: true }, st).ovUsed, 1); eq(RulesAdapterAlphaStrike.attack(u, u, 30, { overheat: true }, st).ovUsed, 0); });
    T('Classic weapon brackets and minimum range', () => { const C = RulesAdapterClassic; const w = DATA.demoWeapons.ABM; eq([3, 4, 9, 10].map(d => C.bracket(w, d)), ['short', 'medium', 'long', null]); const st = fresh(); ok(C.weaponExpected(DATA.demoWeapons.AR15, 5, st).belowMin); ok(!C.weaponExpected(DATA.demoWeapons.AR15, 7, st).belowMin); });
    T('Classic movement heat defaults', () => { const st = fresh(); const C = RulesAdapterClassic; eq([C.moveHeat('hold', 0, st), C.moveHeat('walk', 5, st), C.moveHeat('run', 8, st), C.moveHeat('jump', 2, st), C.moveHeat('jump', 5, st)], [0, 1, 2, 3, 5]); });
    T('Classic fire selection respects heat budget and ammo', () => {
      const st = fresh(); const s = cbtSession(st); const u = s.units.find(x => x.unitId === 'demo-ironmantle-ir6');
      const full = RulesAdapterClassic.attack(u, u, 3, { heatBudget: 99, moveHeat: 0 }, st); eq(full.weapons.length, 4);
      u.cbt.heat = 30; const hot = RulesAdapterClassic.attack(u, u, 3, { heatBudget: 0, moveHeat: 0 }, st); eq(hot.weapons.length, 0);
      u.cbt.heat = 0; u.cbt.ammo = u.cbt.ammo.map(() => 0); const dry = RulesAdapterClassic.attack(u, u, 3, { heatBudget: 99, moveHeat: 0 }, st); ok(dry.weapons.every(x => !x.w.ammoKey), 'no ammo weapons');
    });
    T('Destroyed location disables its weapons', () => { const st = fresh(); const s = cbtSession(st); const u = s.units.find(x => x.unitId === 'demo-ironmantle-ir6'); u.cbt.internal.RA = 0; ok(!RulesAdapterClassic.availableWeapons(u).some(w => w.loc === 'RA')); });

    /* --- battle state --- */
    T('Battle damage never changes the library unit', () => { const st = fresh(); const s = asSession(st); const u = s.units[0]; u.as.armorLeft -= 3; eq(st.units.find(x => x.id === u.unitId).alphaStrike.armor, u.snapshot.alphaStrike.armor); st.units.find(x => x.id === u.unitId).alphaStrike.armor = 1; ok(u.snapshot.alphaStrike.armor !== 1, 'snapshot independent'); });
    T('Session skips units without ruleset data and warns', () => { const st = fresh(); const f = Forces.newForce('classic', 'enemy'); f.entries.push(Forces.newEntry('demo-grubline-hover'), Forces.newEntry('demo-ironmantle-ir6')); st.forces.push(f); const s = BattleState.create({ ruleset: 'classic', friendlyForceId: 'force-demo-cbt-friendly', enemyForceId: f.id, map: { width: 16, height: 17, unit: 'hex' } }, st); eq(s.units.filter(u => u.side === 'enemy').length, 1); ok(s.warnings.some(w => /Grubline/.test(w))); });
    T('Quantity expands into separate battle units', () => { const st = fresh(); st.forces[0].entries[0].qty = 3; const s = asSession(st); eq(s.units.filter(u => u.side === 'friendly').length, 6); });
    T('Auto-deploy keeps units on the table', () => { const st = fresh(); [asSession(st, 'auto'), cbtSession(st, 'auto')].forEach(s => s.units.forEach(u => { ok(u.pos.x >= 0 && u.pos.x <= s.map.width && u.pos.y >= 0 && u.pos.y <= s.map.height, JSON.stringify(u.pos)); })); });
    T('Phase advance wraps into next turn and logs it', () => { const st = fresh(); const s = asSession(st); for (let i = 0; i < 4; i++) BattleState.nextPhase(s); eq(s.turn, 2); eq(s.phaseIndex, 0); ok(TurnLog.toMarkdown(s).includes('## Turn 2')); });
    T('Remaining fraction reflects damage', () => { const st = fresh(); const s = cbtSession(st); const u = s.units[0]; eq(BattleState.remaining(u), 1); u.cbt.armor.CT = 0; ok(BattleState.remaining(u) < 1); });

    /* --- solo assistant --- */
    const setup = (st, dist = 10) => { const s = asSession(st); const e = s.units.find(u => u.side === 'enemy' && u.unitId === 'demo-ironmantle-ir6'); s.units.filter(u => u.side === 'friendly').forEach(f => { s.ctx.pairs[BattleState.pairKey(e.id, f.id)] = { dist }; }); return [s, e]; };
    T('Simple case “enemy is 10 inches away” yields an explained recommendation', () => {
      const st = fresh(); const [s, e] = setup(st, 10); const r = SoloAssistant.recommend(s, e.id, {}, st);
      ok(r.ok, r.errors.join()); ok(r.reco.headline.length > 10); ok(r.reco.why.length > 0); ok(r.reco.assumptions.some(a => /Line of sight/.test(a)), 'LOS assumption'); ok(r.reco.assumptions.some(a => /10" \(typed\)/.test(a)), 'typed distance stated'); ok(r.reco.ruleChecks.length > 0); ok(r.reco.unsupported.length > 0); ok(r.reco.alternatives.length > 0);
    });
    T('Missing distance → asks instead of guessing', () => { const st = fresh(); const s = asSession(st); const e = s.units.find(u => u.side === 'enemy'); const r = SoloAssistant.recommend(s, e.id, {}, st); ok(!r.ok); ok(r.ctx.missing.some(m => m.key === 'dist')); });
    T('Destroyed unit cannot act', () => { const st = fresh(); const [s, e] = setup(st); e.status = 'destroyed'; ok(!SoloAssistant.recommend(s, e.id, {}, st).ok); });
    T('Recommendations are deterministic; re-roll is seeded', () => { const st = fresh(); const [s, e] = setup(st, 14); const a = SoloAssistant.recommend(s, e.id, {}, st).reco.headline, b = SoloAssistant.recommend(s, e.id, {}, st).reco.headline; eq(a, b); const r1 = SoloAssistant.recommend(s, e.id, { reroll: 2 }, st).reco.headline, r2 = SoloAssistant.recommend(s, e.id, { reroll: 2 }, st).reco.headline; eq(r1, r2); });
    T('No candidate exceeds movement; no jump for non-jumpers', () => { const st = fresh(); const [s, e] = setup(st, 20); const ctx = SoloContext.build(s, e.id, st); const c = ActionLegalityChecker.check(CandidateActionGenerator.generate(ctx, PERSONALITIES.balanced), ctx); ok(c.every(x => x.mode === 'hold' || x.moved <= x.mv + 1e-9)); ok(!c.some(x => x.mode === 'jump')); });
    T('Blocked LOS: holding gives no attack', () => { const st = fresh(); const [s, e] = setup(st, 10); Object.values(s.ctx.pairs).forEach(p => { p.los = 'no'; }); const ctx = SoloContext.build(s, e.id, st); const c = ActionLegalityChecker.check(CandidateActionGenerator.generate(ctx, PERSONALITIES.balanced), ctx); ok(c.filter(x => x.mode === 'hold').every(x => !x.attack.inRange)); });
    T('Aggressive favours damage, cautious favours safety', () => {
      const st = fresh(); const [s, e] = setup(st, 16); e.as.armorLeft = 1;
      s.ai.personality = 'aggressive'; const ag = SoloAssistant.recommend(s, e.id, {}, st).ranked[0];
      s.ai.personality = 'cautious'; s.ai.risk = 0.2; const ca = SoloAssistant.recommend(s, e.id, {}, st).ranked[0];
      ok(ag.attack.raw >= ca.attack.raw, `dmg ${ag.attack.raw} vs ${ca.attack.raw}`); ok(ca.incoming <= ag.incoming + 1e-9, `incoming ${ca.incoming} vs ${ag.incoming}`);
    });
    T('Classic recommendation from hex map includes heat calculation', () => { const st = fresh(); const s = cbtSession(st); const e = s.units.find(u => u.side === 'enemy'); const f = s.units.find(u => u.side === 'friendly'); e.pos = { x: 10, y: 5 }; f.pos = { x: 10, y: 11 }; const r = SoloAssistant.recommend(s, e.id, {}, st); ok(r.ok, r.errors.join()); ok(r.reco.ruleChecks.some(x => /Heat phase/.test(x)) || r.reco.headline.includes('physical'), 'heat check'); });
    T('Scorer weights follow personality and priority sliders', () => { const w1 = TacticalScorer.weights({ personality: 'aggressive', priorities: { damage: 1 } }); const w2 = TacticalScorer.weights({ personality: 'aggressive', priorities: { damage: 2 } }); near(w2.damage, w1.damage * 2); });

    /* --- misc --- */
    T('Migration fills missing settings', () => { const s = migrateState({ units: [], settings: { theme: 'light' } }); eq(s.settings.theme, 'light'); eq(s.settings.rulesParams.as.bands.short, 6); ok(Array.isArray(s.forces)); });
    T('CSV / TSV row parsing', () => { eq(parseRows('a,b\n"c, d",e\n\nx\ty'), [['a', 'b'], ['c, d', 'e'], ['x', 'y']]); });
    T('Move string parsing', () => { eq(parseMove('10"/8"j'), [{ inches: 10, mode: '' }, { inches: 8, mode: 'j' }]); eq(parseMove('nonsense'), []); });
    T('Ambiguous abbreviations keep each meaning', () => { const st = fresh(); eq(st.reference.filter(r => r.abbr === 'IS').length, 2); eq(st.reference.filter(r => r.abbr === 'MP').length, 2); });
    T('Every reference entry has a content label and source', () => { fresh().reference.forEach(r => { ok(r.contentType && r.source && r.source.dataSourceId, r.id); }); });
    T('HTML escaping', () => { eq(U.esc('<a href="x">&\''), '&lt;a href=&quot;x&quot;&gt;&amp;&#39;'); });

    const passed = results.filter(r => r.ok).length;
    return { passed, failed: results.length - passed, results, ms: Math.round(performance.now() - t0) };
  },
};

/* =============================================================== Boot ==== */
(function boot() {
  Store.init();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = Actions[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    if (el.closest('summary') && el.tagName === 'BUTTON') e.stopPropagation();
    Promise.resolve(fn(el, e)).catch(err => { console.error(err); UI.toast('Action failed: ' + err.message, 'bad'); });
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (!el) return; const fn = Changes[el.dataset.chg]; if (fn) { try { fn(el, e); } catch (err) { console.error(err); UI.toast('Change failed: ' + err.message, 'bad'); } } });
  document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && Inputs[el.dataset.inp]) Inputs[el.dataset.inp](el, e); });
  document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.ref) UI.tmp.openRef[d.dataset.ref] = d.open; }, true);
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); Disk.saveNow(); } });
  document.getElementById('dlg').addEventListener('close', () => { UI.dlgRender = null; });
  window.addEventListener('beforeunload', e => { if (Disk.handle && Store.dirtyDisk && !Disk.needsPermission) { e.preventDefault(); e.returnValue = ''; } });
  UI.render(); Disk.init();
  if (location.hash === '#selftest') { const r = Tests.run(); window.__selftest = r; console.log(`[MechOps self-test] ${r.passed} passed, ${r.failed} failed`, r.results.filter(x => !x.ok)); }
})();
</script>
