<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MechOps Solo — BattleTech Tabletop Companion</title>
<meta name="description" content="Single-file, offline tabletop companion for Alpha Strike and Classic BattleTech: force builder, record sheets, solo enemy assistant, reference library. Saves to local disk.">
<style>
/* ======================================================================
   MechOps Solo — styles. Original UI; no official artwork or logos.
   ====================================================================== */
:root{
  --bg:#0b0e11; --bg2:#11161b; --panel:#151b21; --panel2:#1b232b; --line:#2a3540; --line2:#3a4855;
  --text:#d9e1e7; --muted:#8a9aa8; --dim:#5f6f7c;
  --accent:#f0a430; --accent2:#ffcf7a; --accent-ink:#1a1206;
  --friend:#3fc1d9; --friend-bg:rgba(63,193,217,.10); --enemy:#ff5a4e; --enemy-bg:rgba(255,90,78,.10);
  --ok:#5fd37a; --warn:#ffc04a; --bad:#ff5a4e; --info:#7fb2ff;
  --as:#f0a430; --classic:#9fd36b;
  --radius:6px; --shadow:0 2px 10px rgba(0,0,0,.45);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:15px; --tap:40px;
}
:root[data-theme="light"]{
  --bg:#ece7da; --bg2:#e3ddcd; --panel:#f6f2e8; --panel2:#ebe5d6; --line:#c9bfa8; --line2:#a99e86;
  --text:#1f2326; --muted:#55606a; --dim:#7d8790;
  --accent:#b8650b; --accent2:#8a4a05; --accent-ink:#fff;
  --friend:#0b7d96; --friend-bg:rgba(11,125,150,.10); --enemy:#c0281e; --enemy-bg:rgba(192,40,30,.09);
  --ok:#1f8a3a; --warn:#9a6a00; --bad:#c0281e; --info:#2b5fb8; --as:#b8650b; --classic:#4d7f1d;
  --shadow:0 2px 8px rgba(60,50,30,.18);
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45;min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:24px 24px}
:root[data-theme="light"] body{background-image:linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px)}
a{color:var(--accent)}
h1,h2,h3,h4{margin:.2em 0 .5em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
h1{font-size:1.35rem} h2{font-size:1.1rem} h3{font-size:.95rem} h4{font-size:.85rem;color:var(--muted)}
p{margin:.4em 0 .7em}
code,pre,.mono{font-family:var(--mono)}
pre{background:var(--bg2);border:1px solid var(--line);padding:10px;border-radius:var(--radius);overflow:auto;font-size:.8rem;max-height:420px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px;z-index:99}
.skip:focus{left:8px}

/* ---------- header / nav ---------- */
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:2px solid var(--accent);box-shadow:var(--shadow)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-weight:800;letter-spacing:.22em;font-size:1.05rem;white-space:nowrap}
.brand-sub{font-size:.68rem;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav.main{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:thin}
nav.main button{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 12px;font:600 .78rem var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap;min-height:var(--tap)}
nav.main button:hover{color:var(--text)}
nav.main button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.save-pill{display:inline-flex;align-items:center;gap:6px;font:600 .72rem var(--mono);padding:5px 9px;border-radius:20px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;color:var(--text)}
.save-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.save-pill.ok .dot{background:var(--ok)} .save-pill.pending .dot{background:var(--warn)} .save-pill.err .dot{background:var(--bad)} .save-pill.local .dot{background:var(--info)}
.rs-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:4px;font:700 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid}
.rs-badge.as{color:var(--as);border-color:var(--as);background:rgba(240,164,48,.08)}
.rs-badge.classic{color:var(--classic);border-color:var(--classic);background:rgba(159,211,107,.08)}
.rs-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border:1px dashed var(--line2);border-radius:var(--radius);margin-bottom:12px;background:var(--bg2)}

main{padding:14px;max-width:1600px;margin:0 auto}
.view-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.view-title h1{margin:0}
.view-title .spacer{flex:1}

/* ---------- panels, grid ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);min-width:0}
.panel>h2:first-child,.panel>h3:first-child,.panel>.panel-head:first-child{margin-top:0}
.panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.panel-head h2,.panel-head h3{margin:0}
.panel-head .spacer{flex:1}
.panel.friendly{border-top:4px solid var(--friend)} .panel.enemy{border-top:4px solid var(--enemy)}
.panel.friendly .side-title{color:var(--friend)} .panel.enemy .side-title{color:var(--enemy)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.builder{display:grid;gap:12px;grid-template-columns:minmax(280px,1fr) minmax(300px,1.15fr) minmax(300px,1.15fr)}
.battle-layout{display:grid;gap:12px;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.ok-t{color:var(--ok)} .warn-t{color:var(--warn)} .bad-t{color:var(--bad)}
.subtabs{display:none;gap:4px;margin-bottom:10px}
.subtabs button{flex:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

/* ---------- controls ---------- */
button,.btn{font:600 .8rem var(--sans);letter-spacing:.05em;min-height:var(--tap);padding:6px 12px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button.ghost{background:transparent}
button.friend{border-color:var(--friend);color:var(--friend);background:var(--friend-bg)}
button.enemy{border-color:var(--enemy);color:var(--enemy);background:var(--enemy-bg)}
button.sm{min-height:32px;padding:3px 8px;font-size:.74rem}
button.xs{min-height:28px;min-width:28px;padding:2px 6px;font-size:.72rem}
button.big{min-height:52px;font-size:.95rem;padding:10px 18px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
label{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.inline{flex-direction:row;align-items:center;gap:6px}
input,select,textarea{font:500 .9rem var(--sans);color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:5px;padding:7px 9px;min-height:var(--tap);min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
input.num{width:72px;text-align:center;font-family:var(--mono)}
input.num-s{width:56px;text-align:center;font-family:var(--mono);padding:4px}
textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:.82rem}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-size:.85rem}
.form-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stepper{display:inline-flex;align-items:center;gap:3px}
.stepper .val{min-width:30px;text-align:center;font:700 .9rem var(--mono)}
details>summary{cursor:pointer;font-weight:600;letter-spacing:.04em;padding:4px 0;list-style-position:inside}
details.box{border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;background:var(--bg2)}

/* ---------- tags / badges ---------- */
.tag{display:inline-block;font:700 .66rem var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.demo{color:#c9a0ff;border-color:#8a63c4}
:root[data-theme="light"] .tag.demo{color:#5b2ea6;border-color:#5b2ea6}
:root[data-theme="light"] .tag.heur{color:#6b5512;border-color:#6b5512}
:root[data-theme="light"] .tag.house{color:#9a1f78;border-color:#9a1f78}
.tag.official{color:var(--ok);border-color:var(--ok)}
.tag.original{color:var(--info);border-color:var(--info)}
.tag.user{color:var(--accent);border-color:var(--accent)}
.tag.house{color:#ff8ad8;border-color:#c45aa6}
.tag.heur{color:#d0b26a;border-color:#8d7a46}
.tag.calc{color:var(--ok);border-color:var(--ok)}
.tag.manual{color:var(--muted)}
.tag.unsup{color:var(--bad);border-color:var(--bad)}
.tag.as{color:var(--as);border-color:var(--as)} .tag.classic{color:var(--classic);border-color:var(--classic)}
.tag.friend{color:var(--friend);border-color:var(--friend)} .tag.enemy{color:var(--enemy);border-color:var(--enemy)}
.notice{border-left:4px solid var(--info);background:var(--bg2);padding:8px 12px;border-radius:4px;margin:8px 0;font-size:.85rem}
.notice.warn{border-left-color:var(--warn)} .notice.bad{border-left-color:var(--bad)} .notice.ok{border-left-color:var(--ok)}
.empty{text-align:center;padding:22px 12px;border:1px dashed var(--line2);border-radius:var(--radius);color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);flex-wrap:wrap}
.lrow .name{font-weight:700;min-width:0}
.lrow .stats{font:.75rem var(--mono);color:var(--muted)}
.lrow .grow{flex:1;min-width:140px}
.lrow.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lrow.friendly{box-shadow:inset 3px 0 0 var(--friend)} .lrow.enemy{box-shadow:inset 3px 0 0 var(--enemy)}
.lrow.destroyed{opacity:.5}
.scroll{max-height:62vh;overflow:auto;padding-right:2px}
table.t{width:100%;border-collapse:collapse;font-size:.82rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{font:700 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg2);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:center;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.84rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}

/* ---------- Alpha Strike card (original design) ---------- */
.as-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ascard{border:2px solid var(--line2);border-radius:8px;background:var(--panel2);overflow:hidden;font-size:.82rem;position:relative}
.ascard.friendly{border-color:var(--friend)} .ascard.enemy{border-color:var(--enemy)}
.ascard .hd{display:flex;align-items:stretch;background:linear-gradient(90deg,#20282f,#2b343c);border-bottom:2px solid var(--as)}
:root[data-theme="light"] .ascard .hd{background:linear-gradient(90deg,#ddd5c2,#e9e2d1)}
.ascard .hd .nm{flex:1;padding:6px 9px;min-width:0}
.ascard .hd .nm b{display:block;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ascard .hd .nm span{font-size:.7rem;color:var(--muted)}
.ascard .pv{background:var(--as);color:#1a1206;padding:4px 10px;text-align:center;font:800 1.15rem var(--mono);display:flex;flex-direction:column;justify-content:center}
.ascard .pv small{font-size:.58rem;letter-spacing:.12em}
.ascard .bd{padding:8px 9px;display:flex;flex-direction:column;gap:6px}
.ascard .line{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono)}
.ascard .line .k{color:var(--muted);font-size:.68rem;letter-spacing:.08em;margin-right:3px}
.dmg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dmg div{border:1px solid var(--line2);border-radius:4px;text-align:center;padding:2px 0;background:var(--bg2)}
.dmg div .k{display:block;font:700 .6rem var(--mono);color:var(--muted);letter-spacing:.06em}
.dmg div b{font:800 1.05rem var(--mono)}
.pips{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--text);background:transparent;padding:0;min-height:0;min-width:0}
.pip.st{border-radius:2px}
.pip.hit{background:var(--bad);border-color:var(--bad)}
button.pip{cursor:pointer}
.ascard .sp{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:700 .68rem var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);min-height:24px;cursor:help}
.ascard .ft{font-size:.66rem;color:var(--dim);padding:4px 9px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ascard .ctl{padding:6px 9px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.heatbar{display:flex;gap:3px}
.heatbar button{min-width:30px;min-height:30px;padding:0;font:700 .75rem var(--mono)}
.heatbar button.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- Classic record-sheet view (original design) ---------- */
.sheet{border:2px solid var(--line2);border-radius:6px;background:var(--panel2);font-size:.8rem;overflow:hidden}
.sheet.friendly{border-color:var(--friend)} .sheet.enemy{border-color:var(--enemy)}
.sheet .sh-hd{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:2px solid var(--classic);background:var(--bg2);flex-wrap:wrap}
.sheet .sh-hd b{font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
.sheet .sh-bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px}
.sheet .blk{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--panel)}
.sheet .blk h4{margin:0 0 5px;font-size:.66rem;letter-spacing:.14em}
.armor-diagram{display:grid;grid-template-columns:repeat(5,1fr);grid-template-areas:". . hd . ." "ra rt ct lt la" "ra rtr ctr ltr la" ". rl . ll .";gap:4px}
.armor-diagram.live{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));grid-template-areas:none}
.armor-diagram.live .loc{flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:4px 6px;grid-area:auto!important}
.armor-diagram.live .loc .ln{width:100%;text-align:left}
.loc{border:1px solid var(--line2);border-radius:5px;padding:3px 2px;text-align:center;background:var(--bg2);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.loc .ln{font:800 .68rem var(--mono);letter-spacing:.06em}
.loc .lv{font:700 .8rem var(--mono)}
.loc .lv .k{font-size:.58rem;color:var(--muted);font-weight:600}
.loc.dmg1{border-color:var(--warn)} .loc.dmg2{border-color:var(--bad);background:rgba(255,90,78,.12)} .loc.gone{border-color:var(--bad);background:repeating-linear-gradient(45deg,rgba(255,90,78,.2) 0 6px,transparent 6px 12px)}
.loc .stepper button{min-height:24px;min-width:24px;padding:0;font-size:.75rem}
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.crit-grid ol{margin:0;padding-left:20px;font-size:.72rem;font-family:var(--mono)}
.wtable td,.wtable th{padding:3px 4px!important}
.wtable tr.destroyed td{text-decoration:line-through;color:var(--dim)}

/* ---------- map ---------- */
.mapwrap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;position:relative}
svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
svg.map .gridline{stroke:var(--line);stroke-width:.06}
svg.map .gridline.major{stroke:var(--line2);stroke-width:.12}
svg.map .hex{fill:transparent;stroke:var(--line2);stroke-width:.05}
svg.map .hex:hover{fill:rgba(240,164,48,.12)}
svg.map .tok text{font:700 .9px var(--mono);fill:#fff;pointer-events:none}
svg.map .tok.f circle{fill:var(--friend)} svg.map .tok.e circle{fill:var(--enemy)}
svg.map .tok.sel circle{stroke:var(--accent);stroke-width:.25}
svg.map .tok.dead circle{opacity:.35}
svg.map .facing{stroke:#fff;stroke-width:.18}
svg.map .rangeline{stroke:var(--accent);stroke-width:.12;stroke-dasharray:.4 .3}
svg.map .rangelbl{font:700 1px var(--mono);fill:var(--accent)}
svg.map .obj{fill:none;stroke:var(--ok);stroke-width:.2;stroke-dasharray:.5 .3}

/* ---------- assistant ---------- */
.reco{border:2px solid var(--enemy);border-radius:var(--radius);background:var(--enemy-bg);padding:12px}
.reco .headline{font-size:1.05rem;font-weight:800;margin:4px 0 8px}
.reco h4{margin:10px 0 4px;color:var(--text)}
.reco ul{margin:0;padding-left:20px;font-size:.86rem}
.scorebar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;min-width:60px}
.scorebar i{display:block;height:100%;background:var(--accent)}
.ctxtable input,.ctxtable select{min-height:34px;padding:4px 6px;font-size:.82rem}
.logentry{border-left:3px solid var(--line2);padding:4px 8px;font-size:.82rem;background:var(--bg2);border-radius:0 4px 4px 0}
.logentry.enemy{border-left-color:var(--enemy)} .logentry.friendly{border-left-color:var(--friend)} .logentry.system{border-left-color:var(--accent)}
.dice-out{font:800 1.6rem var(--mono);min-width:3ch;text-align:center}

/* ---------- reference ---------- */
.refentry{border:1px solid var(--line);border-radius:5px;background:var(--bg2)}
.refentry>summary{display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap;list-style:none}
.refentry>summary::-webkit-details-marker{display:none}
.refentry .abbr{font:800 .9rem var(--mono);color:var(--accent);min-width:56px}
.refentry .body{padding:4px 12px 10px;font-size:.88rem;border-top:1px solid var(--line)}
.refentry .src{font-size:.75rem;color:var(--muted);margin-top:6px}
.letters{display:flex;flex-wrap:wrap;gap:3px}
.letters button{min-width:30px;min-height:30px;padding:0;font:700 .72rem var(--mono)}

/* ---------- dialogs & toasts ---------- */
dialog{border:1px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--text);padding:0;max-width:min(960px,96vw);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .dlg-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:2}
dialog .dlg-hd h2{margin:0;flex:1}
dialog .dlg-bd{padding:14px;max-height:75vh;overflow:auto}
dialog .dlg-ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2)}
#toasts{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:60;max-width:min(380px,90vw)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--accent);padding:8px 12px;border-radius:5px;box-shadow:var(--shadow);font-size:.85rem}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .builder{grid-template-columns:1fr 1fr} .builder .lib-panel{grid-column:1/-1} .battle-layout{grid-template-columns:1fr} }
@media (max-width:820px){
  :root{--fs:15px}
  main{padding:10px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .builder{grid-template-columns:1fr}
  .subtabs{display:flex}
  .builder>.bpanel:not(.active){display:none}
  .battle-layout .bpanel:not(.active){display:none}
  .sheet .sh-bd{grid-template-columns:1fr}
  .brand-sub{display:none}
  .scroll{max-height:none}
  header.top{position:static}
}
@media (min-width:821px){ .battle-tabs{display:none!important} }

/* ---------- print ---------- */
@media print{
  header.top,nav.main,#toasts,.noprint,button{display:none!important}
  body{background:#fff;color:#000}
  .panel,.refentry,.ascard,.sheet{box-shadow:none;border-color:#999;background:#fff;color:#000;break-inside:avoid}
  details{display:block} details>*{display:block}
  body.print-ref main{display:none!important}
}
#printArea{display:none}
body.print-ref #printArea{display:block}

/* ======================================================================

const APP = { name: 'MechOps Solo', version: '1.0.0', schemaVersion: 1 };

/* ---------------------------------------------------------------- U ---- */
const U = {
  uid(p = 'id') { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
  now() { return new Date().toISOString(); },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  num(v, d = 0) { const n = Number(v); return Number.isFinite(n) ? n : d; },
  numOrNull(v) { if (v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; },
  round(v, p = 1) { const f = 10 ** p; return Math.round(v * f) / f; },
  sum(a) { return a.reduce((s, x) => s + x, 0); },
  by(k) { return (a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0); },
  fmtTime(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' }); },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  /** deterministic PRNG (mulberry32) so tactical variance is testable */
  rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  download(filename, text, mime = 'application/json') {
    const blob = new Blob([text], { type: mime }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  slug(s) { return String(s || 'file').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'file'; },
  weightClass(t) { if (t == null) return 'unknown'; if (t < 40) return 'light'; if (t < 60) return 'medium'; if (t < 80) return 'heavy'; return 'assault'; },
};

}

  const ammo = (o.ammo || []).map(([k, loc, shots]) => ({ key: k, name: DATA.demoWeapons[k].name + ' Ammo', loc, shots }));
  const ts = U.now();
  const u = {

}

<script>
'use strict';
/* ============================================================ Schema ==== */
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const isDmg = v => isNum(v) || v === '0*';
const Schema = {
  validateUnit(u) {
    const e = [], w = [];
    if (!u || typeof u !== 'object' || Array.isArray(u)) return { errors: ['Unit entry is not an object.'], warnings: [] };
    if (!u.id || typeof u.id !== 'string') e.push('Missing "id" (text).');
    if (!u.name || typeof u.name !== 'string') e.push('Missing "name" (text).');
    if (!u.alphaStrike && !u.classic) w.push('No Alpha Strike or Classic profile — it cannot be used in either ruleset until one is added.');
    const a = u.alphaStrike;
    if (a) {
      if (!isNum(a.pv)) e.push('Alpha Strike: "pv" must be a number.');
      if (!a.damage || ['s', 'm', 'l'].some(k => !isDmg(a.damage[k]))) e.push('Alpha Strike: damage needs s, m and l values (number or "0*").');
      if (a.damage && a.damage.e != null && !isDmg(a.damage.e)) e.push('Alpha Strike: damage.e must be a number, "0*" or null.');
      if (!isNum(a.armor)) e.push('Alpha Strike: "armor" must be a number.');
      if (!isNum(a.structure)) e.push('Alpha Strike: "structure" must be a number.');
      if (!Array.isArray(a.move) || !a.move.length || a.move.some(m => !m || !isNum(m.inches))) e.push('Alpha Strike: "move" needs at least one {"inches": n, "mode": ""} entry.');
      if (a.specials != null && !Array.isArray(a.specials)) e.push('Alpha Strike: "specials" must be a list.');
      if (a.size != null && !isNum(a.size)) e.push('Alpha Strike: "size" must be a number.');
      if (a.ov != null && !isNum(a.ov)) e.push('Alpha Strike: "ov" must be a number.');
    }
    const c = u.classic;
    if (c) {
      if (!isNum(c.walk)) e.push('Classic: "walk" must be a number.');
      if (c.run != null && !isNum(c.run)) e.push('Classic: "run" must be a number.');
      if (c.jump != null && !isNum(c.jump)) e.push('Classic: "jump" must be a number.');
      if (c.tonnage != null && !isNum(c.tonnage)) e.push('Classic: "tonnage" must be a number.');
      if (!isNum(c.heatSinks) && !isNum(c.dissipation)) w.push('Classic: heat sinks / dissipation not supplied — heat planning disabled for this unit.');
      CLASSIC_LOCS.forEach(l => { if (!c.armor || !isNum(c.armor[l])) e.push(`Classic: armor.${l} must be a number.`); if (!c.internal || !isNum(c.internal[l])) e.push(`Classic: internal.${l} must be a number.`); });
      CLASSIC_REAR.forEach(l => { if (!c.armor || !isNum(c.armor[l])) w.push(`Classic: rear armor ${l} not supplied.`); });
      if (!Array.isArray(c.weapons)) e.push('Classic: "weapons" must be a list (can be empty).');
      else c.weapons.forEach((wp, i) => {
        const n = `Classic weapon #${i + 1}${wp && wp.name ? ' (' + wp.name + ')' : ''}`;
        if (!wp || !wp.name) e.push(`${n}: missing name.`);
        ['heat', 'damage', 'short', 'medium', 'long'].forEach(k => { if (!wp || !isNum(wp[k])) e.push(`${n}: "${k}" must be a number.`); });
        if (wp && wp.loc && !CLASSIC_LOCS.includes(wp.loc)) w.push(`${n}: unknown location "${wp.loc}".`);
      });
      if (c.ammo != null && (!Array.isArray(c.ammo) || c.ammo.some(x => !x || !x.key || !isNum(x.shots)))) e.push('Classic: "ammo" must be a list of {key, shots}.');
    }
    return { errors: e, warnings: w };
  },
  validateForce(f) {
    const e = [], w = [];
    if (!f || typeof f !== 'object') return { errors: ['Force is not an object.'], warnings: [] };
    if (!f.id) e.push('Force: missing "id".');
    if (!f.name) e.push('Force: missing "name".');
    if (!RULESETS[f.ruleset]) e.push('Force: "ruleset" must be "as" or "classic".');
    if (!Array.isArray(f.entries)) e.push('Force: "entries" must be a list.');
    else f.entries.forEach((en, i) => { if (!en || !en.unitId) e.push(`Force entry #${i + 1}: missing unitId.`); if (en && en.qty != null && !(Number.isInteger(en.qty) && en.qty >= 1)) e.push(`Force entry #${i + 1}: qty must be a whole number ≥ 1.`); });
    return { errors: e, warnings: w };
  },
  validateRefEntry(r) {
    const e = [];
    if (!r || !r.id) e.push('Reference entry: missing id.');
    if (!r || !r.title) e.push('Reference entry: missing title.');
    if (r && r.category && !DATA.refCategories.some(c => c.id === r.category)) e.push(`Reference entry: unknown category "${r.category}".`);
    return { errors: e, warnings: [] };
  },
  /** Normalise any supported JSON payload into collections. */
  readBundle(obj) {
    const out = { kind: 'unknown', units: [], forces: [], sessions: [], reference: [], refTables: [], dataSources: [], settings: null, errors: [] };
    if (Array.isArray(obj)) { out.kind = 'units'; out.units = obj; return out; }
    if (!obj || typeof obj !== 'object') { out.errors.push('File does not contain a JSON object.'); return out; }
    if (obj.schemaVersion && obj.schemaVersion > APP.schemaVersion) out.errors.push(`File uses schema version ${obj.schemaVersion}; this app supports up to ${APP.schemaVersion}. Please update the app.`);
    const st = obj.type === 'mechops-backup' ? obj.state : null;
    if (st) { Object.assign(out, { kind: 'backup', units: st.units || [], forces: st.forces || [], sessions: st.sessions || [], reference: st.reference || [], refTables: st.refTables || [], dataSources: st.dataSources || [], settings: st.settings || null }); return out; }
    if (obj.type === 'mechops-force') { out.kind = 'force'; out.forces = obj.force ? [obj.force] : []; out.units = obj.units || []; return out; }
    if (obj.type === 'mechops-forces') { out.kind = 'forces'; out.forces = obj.forces || []; out.units = obj.units || []; return out; }
    if (obj.type === 'mechops-units') { out.kind = 'units'; out.units = obj.units || []; return out; }
    if (obj.type === 'mechops-reference') { out.kind = 'reference'; out.reference = obj.entries || []; out.refTables = obj.tables || []; return out; }
    if (obj.type === 'mechops-session') { out.kind = 'session'; out.sessions = obj.session ? [obj.session] : []; return out; }
    if (obj.alphaStrike || obj.classic) { out.kind = 'units'; out.units = [obj]; return out; }
    out.errors.push('Unrecognised file. Expected a MechOps export (type: mechops-backup / mechops-force / mechops-units / mechops-reference) or a list of units.');
    return out;
  },
};

/* ============================================================ Units ==== */
const Units = {
  hasProfile(u, rs) { return !!(u && u[RULESETS[rs].profile]); },
  asDamage(v, settings) { if (v === '0*') return (settings || Store.state.settings).ai.minimalDamage; return isNum(v) ? v : 0; },
  asMoves(a) {
    const mv = (a && a.move) || [];
    const ground = mv.filter(m => m.mode !== 'j').reduce((x, m) => Math.max(x, m.inches), 0);
    const jump = mv.filter(m => m.mode === 'j').reduce((x, m) => Math.max(x, m.inches), 0);
    return { ground, jump, label: mv.map(m => `${m.inches}"${m.mode || ''}`).join('/') || '—' };
  },
  dissipation(c) { if (!c) return null; if (isNum(c.dissipation)) return c.dissipation; if (!isNum(c.heatSinks)) return null; return c.heatSinks * (c.heatSinkType === 'double' ? 2 : 1); },
  classicRun(c) { return isNum(c.run) ? c.run : Math.ceil((c.walk || 0) * 1.5); },
  weightClass(u) {
    if (isNum(u.tonnage)) return U.weightClass(u.tonnage);
    if (u.classic && isNum(u.classic.tonnage)) return U.weightClass(u.classic.tonnage);
    const s = u.alphaStrike && u.alphaStrike.size; return ({ 1: 'light', 2: 'medium', 3: 'heavy', 4: 'assault' })[s] || 'unknown';
  },
  label(u) { return u ? `${u.name}${u.variant ? ' ' + u.variant : ''}` : 'Missing unit'; },
  blank() {
    const ts = U.now();
    return { id: U.uid('unit'), schemaVersion: 1, name: 'New unit', variant: '', kind: 'BattleMech', faction: '', era: '', techBase: '', tonnage: null, role: '', demo: false,
      source: { dataSourceId: 'ds-user', note: '' }, createdAt: ts, updatedAt: ts, alphaStrike: null, classic: null };
  },
  blankAS() { return { type: 'BM', size: 1, move: [{ inches: 10, mode: '' }], role: '', damage: { s: 0, m: 0, l: 0, e: null }, ov: 0, armor: 1, structure: 1, pv: 0, specials: [], tmm: null, skill: 4 }; },
  blankClassic() {
    const z = () => Object.fromEntries(CLASSIC_LOCS.map(l => [l, 0]));
    return { tonnage: null, techBase: '', walk: 4, run: 6, jump: 0, heatSinks: 10, heatSinkType: 'single', dissipation: null,
      armor: Object.assign(z(), { CTR: 0, LTR: 0, RTR: 0 }), internal: z(), weapons: [], ammo: [], crits: {}, equipment: [], gunnery: 4, piloting: 5, bv: null };
  },
  usedBy(unitId, st = Store.state) { return st.forces.filter(f => f.entries.some(e => e.unitId === unitId)); },
};

/* =========================================================== Forces ==== */
const Forces = {
  newForce(ruleset, role, name) {
    const ts = U.now();
    return { id: U.uid('force'), schemaVersion: 1, name: name || (role === 'enemy' ? 'New enemy force' : 'New friendly force'), ruleset, role: role || 'friendly', entries: [], limits: { pv: null, units: null, tonnage: null }, notes: '', createdAt: ts, updatedAt: ts };
  },
  newEntry(unitId) { return { id: U.uid('fe'), unitId, qty: 1, skill: 4, pvOverride: null, gunnery: 4, piloting: 5, callsign: '' }; },
  pvFor(entry, unit) { if (isNum(entry.pvOverride)) return entry.pvOverride; return unit && unit.alphaStrike && isNum(unit.alphaStrike.pv) ? unit.alphaStrike.pv : 0; },
  totals(force, units) {
    const find = id => units.find(u => u.id === id);
    let count = 0, pv = 0, tonnage = 0, tonKnown = true; const missing = [], comp = {};
    force.entries.forEach(e => {
      const u = find(e.unitId); const q = e.qty || 1; count += q;
      if (!u) { missing.push({ entry: e, reason: 'Unit not found in library' }); return; }
      if (!Units.hasProfile(u, force.ruleset)) missing.push({ entry: e, reason: `No ${RULESETS[force.ruleset].name} data` });

  },
  limitWarnings(force, tot) {
    const w = [], L = force.limits || {};

    if (isNum(L.units) && tot.count > L.units) w.push(`${tot.count} units exceeds the limit of ${L.units}.`);
    if (isNum(L.tonnage) && tot.tonnage > L.tonnage) w.push(`${tot.tonnage} t exceeds the tonnage limit of ${L.tonnage} t.`);
    tot.missing.forEach(m => w.push(`Entry “${m.entry.callsign || m.entry.unitId}”: ${m.reason}.`));

};

/* ======================================================== Probability ==== */
const Prob = {
  /** P(2D6 >= n) — exact, from 36 outcomes */
  p2d6AtLeast(n) { let ways = 0; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) if (a + b >= n) ways++; return ways / 36; },
  ways2d6AtLeast(n) { return Math.round(Prob.p2d6AtLeast(n) * 36); },
  roll(n = 2, rnd = Math.random) { const d = []; for (let i = 0; i < n; i++) d.push(1 + Math.floor(rnd() * 6)); return d; },
};

/* ===================================================== Geometry / Hex ==== */
const Geo = {
  SQ3: Math.sqrt(3),
  hexCenter(col, row) { return { x: 1.5 * col + 1, y: Geo.SQ3 * (row + 0.5 * (col & 1)) + Geo.SQ3 / 2 }; },
  toCube(col, row) { const x = col, z = row - (col - (col & 1)) / 2; return { x, y: -x - z, z }; },
  hexDistance(a, b) { const p = Geo.toCube(a.x, a.y), q = Geo.toCube(b.x, b.y); return Math.max(Math.abs(p.x - q.x), Math.abs(p.y - q.y), Math.abs(p.z - q.z)); },
  inchDistance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); },
  facingAngle(dir) { return -90 + 60 * ((dir % 6 + 6) % 6); },
  norm180(a) { a = ((a + 180) % 360 + 360) % 360 - 180; return a; },
};

/* ====================================================== BattleState ==== */
const MAP_PRESETS = {
  as: [{ id: 'as-36x24', label: '36" × 24" (3×2 ft)', width: 36, height: 24, unit: 'in' }, { id: 'as-48x36', label: '48" × 36" (4×3 ft)', width: 48, height: 36, unit: 'in' }, { id: 'as-72x48', label: '72" × 48" (6×4 ft)', width: 72, height: 48, unit: 'in' }, { id: 'custom', label: 'Custom size', width: 48, height: 36, unit: 'in' }],
  classic: [{ id: 'cbt-1', label: '1 mapsheet (16 × 17 hexes)', width: 16, height: 17, unit: 'hex' }, { id: 'cbt-2', label: '2 mapsheets (32 × 17 hexes)', width: 32, height: 17, unit: 'hex' }, { id: 'cbt-4', label: '4 mapsheets (32 × 34 hexes)', width: 32, height: 34, unit: 'hex' }, { id: 'custom', label: 'Custom hex grid', width: 20, height: 17, unit: 'hex' }],
};
const SCENARIOS = [
  { id: 'standup', name: 'Stand-up fight', support: 'supported', note: 'No special rules; the assistant focuses on damage and survival.' },
  { id: 'hold', name: 'Hold the objective', support: 'partial', note: 'Set an objective point; the assistant scores progress toward it. Victory conditions are tracked manually.' },

  { id: 'floating-crits', name: 'Floating criticals', support: 'unsupported' },
  { id: 'facing-as', name: 'Facing (Alpha Strike optional)', support: 'unsupported' },
  { id: 'spa', name: 'Special pilot abilities', support: 'unsupported' },
  { id: 'hidden-units', name: 'Hidden units', support: 'unsupported' },
  { id: 'indirect-fire', name: 'Indirect fire', support: 'unsupported' },

const BattleState = {

      scenario: Object.assign({ type: 'standup', description: '', objective: null, objectiveLabel: 'Objective' }, opts.scenario || {}),
      options: Object.assign({ optionalRules: [], notes: '' }, opts.options || {}),

      let n = 0;
      f.entries.forEach(e => {
        const u = st.units.find(x => x.id === e.unitId);
        if (!u) { s.warnings.push(`${f.name}: unit ${e.unitId} missing from library — skipped.`); return; }
        if (!Units.hasProfile(u, rs)) { s.warnings.push(`${Units.label(u)} lacks ${RULESETS[rs].name} data — skipped.`); return; }
        for (let q = 0; q < (e.qty || 1); q++) { n++; s.units.push(BattleState.newUnitState(u, e, side, n, rs)); }

  newUnitState(u, e, side, n, rs) {

  autoDeploy(s) {

  placed(u) { return u && isNum(u.pos.x) && isNum(u.pos.y); },
  /** Distance in the ruleset's unit (inches for AS, hexes for Classic). Returns null if not placed. */
  mapDistance(s, a, b, st = Store.state) {
    if (!BattleState.placed(a) || !BattleState.placed(b)) return null;
    if (s.map.unit === 'hex') return Geo.hexDistance(a.pos, b.pos);
    const d = Geo.inchDistance(a.pos, b.pos);

  },
  center(s, u) { if (!BattleState.placed(u)) return null; return s.map.unit === 'hex' ? Geo.hexCenter(u.pos.x, u.pos.y) : { x: u.pos.x, y: u.pos.y }; },
  /** Approximate arc of `to` as seen from `from` (Classic). */
  arc(s, from, to) {

  operational(u) { return u && (u.status === 'active' || u.status === 'crippled'); },
  remaining(u) {
    if (u.as) { const a = u.snapshot.alphaStrike; const max = a.armor + a.structure; return max ? (Math.max(0, u.as.armorLeft) + Math.max(0, u.as.structLeft)) / max : 0; }

  nextPhase(s) {
    s.phaseIndex++;

    else TurnLog.add(s, { side: 'system', type: 'phase', text: `Phase: ${BattleState.phaseName(s)}.` });
  },

};

/* ========================================================== TurnLog ==== */
const TurnLog = {
  add(s, { side = 'system', type = 'note', text, unitId = null, details = null }) {
    const e = { id: U.uid('log'), ts: U.now(), turn: s.turn, phase: BattleState.phaseName(s), side, type, unitId, text, details };
    s.log.push(e); s.updatedAt = e.ts; return e;
  },
  toMarkdown(s) {
    const lines = [`# ${s.name}`, '', `Ruleset: ${RULESETS[s.ruleset].name} · ${s.friendlyForceName} vs ${s.enemyForceName}`, `Exported: ${new Date().toLocaleString()}`, ''];
    let turn = null;
    s.log.forEach(e => { if (e.turn !== turn) { turn = e.turn; lines.push('', `## Turn ${turn}`); } lines.push(`- [${e.phase}] (${e.side}) ${e.text}`); });
    return lines.join('\n');
  },
};

/* ======================================================== Defaults ==== */
function defaultSettings() {
  return {
    theme: 'dark', textScale: 1, defaultRuleset: 'as', autosaveDisk: true, largeTargets: false,
    rulesParams: {
      as: { bands: { short: 6, medium: 24, long: 42 }, weaponHitPenalty: 1, mpHitHalves: true },
      classic: { moveHeat: { stand: 0, walk: 1, run: 2, jumpMin: 3 }, hexInches: 2 },
    },
    ai: { bandFactor: { s: 1, m: 0.85, l: 0.7, e: 0.5 }, coverFactor: { none: 1, partial: 0.7, unknown: 0.85 }, clusterFactor: 0.6, variance: 0.15, minimalDamage: 0.5, rangeFactor: { short: 1, medium: 0.8, long: 0.6 } },
    limits: { as: { pv: null, units: null }, classic: { tonnage: null, units: null } },
  };
}
function seedReference() {
  const ts = U.now(); const out = [];
  DATA.abbreviations.forEach(([abbr, full, rs, body, kw], i) => out.push({ id: `ref-abbr-${U.slug(abbr)}-${i}`, schemaVersion: 1, category: 'abbr', title: `${abbr} — ${full}`, abbr, full, ruleset: rs, contentType: 'original', body, keywords: kw, source: { dataSourceId: 'ds-orig', page: '' }, edition: '', favourite: false, createdAt: ts }));
  [...DATA.refEntries, ...DATA.houseRules.map(h => [...h, 'ds-user'])].forEach(([cat, title, rs, body, kw, ds], i) => out.push({ id: `ref-${cat}-${i}`, schemaVersion: 1, category: cat, title, ruleset: rs, contentType: cat === 'house' ? 'house' : 'original', body, keywords: kw, source: { dataSourceId: ds || 'ds-orig', page: '' }, edition: '', favourite: false, createdAt: ts }));
  return out;
}
function freshState() {
  const ts = U.now();
  return {
    meta: { app: APP.name, schemaVersion: APP.schemaVersion, createdAt: ts, updatedAt: ts },
    units: DATA.demoUnits(), forces: DATA.demoForces(), sessions: [], reference: seedReference(), refTables: DATA.refTables(),
    dataSources: U.clone(DATA.dataSources), settings: defaultSettings(),
    ui: { asFriendly: 'force-demo-as-friendly', asEnemy: 'force-demo-as-enemy', classicFriendly: 'force-demo-cbt-friendly', classicEnemy: 'force-demo-cbt-enemy', activeSessionId: null },
  };
}
function deepDefaults(target, defs) {
  Object.keys(defs).forEach(k => {
    if (target[k] === undefined) target[k] = U.clone(defs[k]);
    else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') deepDefaults(target[k], defs[k]);
  });

}
function migrateState(s) {
  const f = freshState();
  ['units', 'forces', 'sessions', 'reference', 'refTables', 'dataSources'].forEach(k => { if (!Array.isArray(s[k])) s[k] = f[k]; });
  s.meta = deepDefaults(s.meta || {}, f.meta); s.settings = deepDefaults(s.settings || {}, f.settings); s.ui = deepDefaults(s.ui || {}, f.ui);
  return s;
}

/* ============================================================ Store ==== */
const Store = {
  KEY: 'mechops.solo.v1', state: null, localOk: true, dirtyDisk: false,
  init() {
    let s = null;
    try { const raw = localStorage.getItem(this.KEY); if (raw) s = JSON.parse(raw); } catch (e) { this.localOk = false; }
    this.state = s ? migrateState(s) : freshState();
    if (!s) this.persistLocal();
  },
  serialize() { return JSON.stringify({ type: 'mechops-backup', schemaVersion: APP.schemaVersion, app: APP.name, appVersion: APP.version, savedAt: U.now(), state: this.state }, null, 1); },
  persistLocal() { try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); this.localOk = true; } catch (e) { this.localOk = false; } },
  commit(opts = {}) {
    this.state.meta.updatedAt = U.now(); this.persistLocal(); this.dirtyDisk = true;
    if (typeof Disk !== 'undefined') Disk.onChange();
    if (typeof UI !== 'undefined') { if (opts.silent) UI.renderStatus(); else UI.render(); }
  },
  replace(newState) { this.state = migrateState(newState); this.commit(); },
  unit(id) { return this.state.units.find(u => u.id === id); },
  force(id) { return this.state.forces.find(f => f.id === id); },
  session(id) { return this.state.sessions.find(s => s.id === id); },
};

/* =========================================================== Import ==== */
const Importer = {
  /** Analyse a payload against current state. Returns items with validation + conflict info. */
  analyze(obj, st = Store.state) {
    const b = Schema.readBundle(obj); const items = [];
    const push = (kind, item, v, conflict) => items.push({ kind, item, errors: v.errors, warnings: v.warnings || [], conflict });
    b.units.forEach(u => {
      const v = Schema.validateUnit(u);
      const conflict = st.units.find(x => x.id === u.id) || st.units.find(x => u && x.name && u.name && x.name.toLowerCase() === u.name.toLowerCase() && (x.variant || '').toLowerCase() === (u.variant || '').toLowerCase()) || null;
      push('unit', u, v, conflict);
    });
    b.forces.forEach(f => { const v = Schema.validateForce(f); push('force', f, v, st.forces.find(x => x.id === f.id) || st.forces.find(x => x.name === f.name && x.ruleset === f.ruleset) || null); });
    b.sessions.forEach(s => { const v = { errors: (!s || !s.id || !RULESETS[s.ruleset] || !Array.isArray(s.units)) ? ['Session is missing id, ruleset or units.'] : [], warnings: [] }; push('session', s, v, st.sessions.find(x => x.id === s.id) || null); });
    b.reference.forEach(r => push('reference', r, Schema.validateRefEntry(r), st.reference.find(x => x.id === r.id) || null));
    b.refTables.forEach(tb => push('refTable', tb, { errors: (!tb || !tb.id || !Array.isArray(tb.columns) || !Array.isArray(tb.rows)) ? ['Table needs id, columns and rows.'] : [], warnings: [] }, st.refTables.find(x => x.id === tb.id) || null));
    b.dataSources.forEach(d => push('dataSource', d, { errors: (!d || !d.id || !d.title) ? ['Data source needs id and title.'] : [], warnings: [] }, st.dataSources.find(x => x.id === d.id) || null));

  },
  /** mode: skip | replace | merge (merge = existing fields kept unless the import supplies them) */
  apply(an, mode, st = Store.state) {
    const coll = { unit: 'units', force: 'forces', session: 'sessions', reference: 'reference', refTable: 'refTables', dataSource: 'dataSources' };
    const res = { added: 0, replaced: 0, merged: 0, skipped: 0, invalid: 0, idMap: {} };
    an.items.forEach(it => {
      if (it.errors.length) { res.invalid++; return; }
      const arr = st[coll[it.kind]]; const item = U.clone(it.item);
      if (it.conflict) {
        const idx = arr.indexOf(it.conflict);
        if (mode === 'skip') { res.skipped++; if (it.kind === 'unit' && item.id !== it.conflict.id) res.idMap[item.id] = it.conflict.id; return; }
        if (it.kind === 'unit' && item.id !== it.conflict.id) res.idMap[item.id] = it.conflict.id;
        item.id = it.conflict.id;
        if (mode === 'replace') { arr[idx] = item; res.replaced++; }
        else { arr[idx] = Object.assign({}, it.conflict, item); res.merged++; }
      } else { arr.push(item); res.added++; }
    });

    if (Object.keys(res.idMap).length) st.forces.forEach(f => f.entries.forEach(e => { if (res.idMap[e.unitId]) e.unitId = res.idMap[e.unitId]; }));
    return res;
  },
};

<script>
'use strict';
/* ====================================================== IDB (handle) ==== */
const IDB = {
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('mechops-solo', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); },
};

/* ============================================================= Disk ==== */
/* Local-disk save: File System Access API (Chrome / Edge / Opera) with
   a linked save file and auto-save; download/upload fallback elsewhere. */
const Disk = {
  handle: null, needsPermission: false, lastSaved: null, lastDownload: null, error: null, saving: false,
  pickerTypes: [{ description: 'MechOps Solo save (JSON)', accept: { 'application/json': ['.json'] } }],
  supported() { return typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function'; },
  fileName() { return this.handle ? this.handle.name : null; },
  async init() {
    if (!this.supported()) { UI.renderStatus(); return; }
    try {
      const h = await IDB.get('saveHandle');
      if (h) { this.handle = h; const p = await h.queryPermission({ mode: 'readwrite' }); this.needsPermission = p !== 'granted'; }
    } catch (e) { /* storage unavailable: fine */ }
    UI.renderStatus();
  },
  async link() {

      const h = await window.showSaveFilePicker({ suggestedName: 'mechops-solo-save.json', types: this.pickerTypes });
      this.handle = h; this.needsPermission = false; try { await IDB.set('saveHandle', h); } catch (e) { }
      await this.write(); UI.toast(`Linked save file “${h.name}”. Changes are saved there${Store.state.settings.autosaveDisk ? ' automatically' : ' when you press Save'}.`, 'ok');

  },
  async reconnect() {

    catch (e) { UI.toast('Permission request failed: ' + e.message, 'bad'); }
    UI.render();
  },
  async unlink() { this.handle = null; this.needsPermission = false; try { await IDB.del('saveHandle'); } catch (e) { } UI.toast('Save file unlinked. Data stays in browser storage until you save again.'); UI.render(); },
  async write() {

    catch (e) { this.error = e.message || String(e); if (e.name === 'NotAllowedError') this.needsPermission = true; }
