  },
  /* ---- small helpers ---- */
  empty(title, text, btn = '') { return `<div class="empty"><strong>${E(title)}</strong>${E(text)}${btn ? `<div class="row" style="justify-content:center;margin-top:10px">${btn}</div>` : ''}</div>`; },
  tagsForUnit(u) { const ds = dsById(u.source && u.source.dataSourceId); return `${u.demo ? '<span class="tag demo">Fictional demo</span>' : ''}${ds && !u.demo ? contentTag(ds.type) : ''}`; },
  provenance(u) { const ds = dsById(u.source && u.source.dataSourceId); return `${u.demo ? '<span class="tag demo">Fictional demo data — not official</span>' : ''} Source: ${E(ds ? ds.title : 'Unknown / not supplied')}${ds && ds.edition ? ' · ' + E(ds.edition) : ''}${u.source && u.source.note ? ' — ' + E(u.source.note) : ''} · schema v${u.schemaVersion || 1}`; },
  specialInfo(code) {
    const base = (String(code).match(/^[A-Z]+/) || [code])[0];
    const r = Store.state.reference.find(x => x.category === 'abbr' && (x.ruleset === 'as' || x.ruleset === 'both') && String(x.abbr).toUpperCase() === base);
    return r ? { full: r.full, body: r.body } : null;
  },
};

/* --------------------------------------------- AS card (original design) ---- */
function renderASCard(u, opts = {}) {
  const a = u.alphaStrike; const us = opts.us; const side = opts.side || (us && us.side) || '';
  if (!a) return `<div class="notice warn">${E(Units.label(u))}: no Alpha Strike data — ${E(t('unknown'))}.</div>`;
  const st = Store.state; const b = st.settings.rulesParams.as.bands; const key = opts.key || u.id;
  const entry = opts.entry; const pv = entry ? Forces.pvFor(entry, u) : a.pv;
  const mv = Units.asMoves(a).label;
  const dmgBox = (k, label, range) => { const v = a.damage[k]; const shown = v == null ? '—' : v; const eff = us && v != null ? RulesAdapterAlphaStrike.dmgAt(us, k, st) : null; return `<div title="${E(range)}"><span class="k">${label}</span><b>${E(shown)}</b>${eff != null && eff !== Units.asDamage(v) ? `<span class="tiny bad-t" title="After recorded weapon hits (calculated)"> →${eff}</span>` : ''}</div>`; };
  const armorLeft = us ? us.as.armorLeft : a.armor, structLeft = us ? us.as.structLeft : a.structure;
  const pips = (n, left, kind) => { let h = ''; const dmg = n - left; for (let i = 0; i < n; i++) { const hit = i < dmg; h += us ? `<button class="pip ${kind}${hit ? ' hit' : ''}" data-act="asPip" data-us="${us.id}" data-kind="${kind}" data-i="${i}" aria-label="${kind === 'st' ? 'Structure' : 'Armor'} point ${i + 1}${hit ? ' (damaged)' : ''}"></button>` : `<span class="pip ${kind}"></span>`; } return h; };
  const chips = (a.specials || []).map(sp => { const inf = UI.specialInfo(sp); return `<button class="chip" data-act="explainSpecial" data-key="${E(key)}" data-code="${E(sp)}" title="${E(inf ? inf.full : 'Not in reference library')}" aria-expanded="${UI.tmp.explain === key + '|' + sp}">${E(sp)}</button>`; }).join('');
  let expl = '';
  if (UI.tmp.explain && UI.tmp.explain.startsWith(key + '|')) { const code = UI.tmp.explain.slice(key.length + 1); const inf = UI.specialInfo(code); expl = `<div class="notice small"><b>${E(code)}</b> — ${inf ? `${E(inf.full)}: ${E(inf.body)}` : 'No reference entry yet — add one in the Reference Library (Abbreviations).'}</div>`; }
  let ctl = '';
  if (us) {
    const heat = [0, 1, 2, 3, 4].map(h => `<button class="${us.as.heat >= h && h > 0 ? 'on' : ''}" data-act="asHeat" data-us="${us.id}" data-h="${h}" aria-pressed="${us.as.heat === h}" title="Heat ${h}${h === 4 ? ' (shutdown level)' : ''}">${h === 4 ? 'S' : h}</button>`).join('');
    const crit = (k, l) => `<span class="stepper" title="${l} critical hits (manual)"><span class="tiny muted">${l}</span><button class="xs" data-act="asCrit" data-us="${us.id}" data-k="${k}" data-d="-1" aria-label="Remove ${l} hit">−</button><span class="val">${us.as.crits[k]}</span><button class="xs" data-act="asCrit" data-us="${us.id}" data-k="${k}" data-d="1" aria-label="Add ${l} hit">+</button></span>`;
    ctl = `<div class="ctl"><span class="tiny muted">HEAT</span><span class="heatbar">${heat}</span><span class="tag manual">manual</span></div>
      <div class="ctl">${crit('engine', 'ENG')}${crit('fc', 'FC')}${crit('mp', 'MP')}${crit('weapons', 'WEAP')}<span class="tag manual">manual</span></div>
      <div class="ctl">${statusSelect(us)}<span class="tiny muted">Remaining A ${Math.max(0, armorLeft)}/${a.armor} · S ${Math.max(0, structLeft)}/${a.structure}</span><span class="tag calc">calc</span></div>`;
  }
  const entryCtl = opts.entryCtl || '';
  return `<article class="ascard ${side}" aria-label="Alpha Strike card ${E(Units.label(u))}">
    <div class="hd"><div class="nm"><b>${E(us ? us.name : u.name)}</b><span>${E(u.variant || '')} · ${E(u.kind || '')}${us ? ` · ${E(us.label)}` : ''}</span></div><div class="pv" title="Point Value${entry && isNum(entry.pvOverride) ? ' (override)' : ''}"><small>PV</small>${E(pv)}</div></div>
    <div class="bd">
      <div class="line"><span><span class="k">TP</span>${E(a.type || '—')}</span><span><span class="k">SZ</span>${E(a.size ?? '—')}</span><span><span class="k">MV</span>${E(mv)}</span><span title="Target Movement Modifier — shown only if supplied"><span class="k">TMM</span>${E(a.tmm ?? '—')}</span><span><span class="k">ROLE</span>${E(a.role || u.role || '—')}</span><span><span class="k">SKILL</span>${E(us ? us.skill : entry ? entry.skill : (a.skill ?? 4))}</span></div>
      <div class="dmg">${dmgBox('s', 'S', `0–${b.short}"`)}${dmgBox('m', 'M', `>${b.short}–${b.medium}"`)}${dmgBox('l', 'L', `>${b.medium}–${b.long}"`)}${dmgBox('e', 'E', `>${b.long}"`)}</div>
      <div class="line"><span><span class="k">OV</span>${E(a.ov ?? 0)}</span><span><span class="k">FACTION</span>${E(u.faction || '—')}</span></div>
      <div class="pips" aria-label="Armor"><span class="k tiny muted" style="width:18px">A</span>${pips(a.armor, armorLeft, 'ar')}</div>
      <div class="pips" aria-label="Structure"><span class="k tiny muted" style="width:18px">S</span>${pips(a.structure, structLeft, 'st')}</div>
      ${chips ? `<div class="sp">${chips}</div>` : ''}${expl}
    </div>${ctl}${entryCtl}
    <div class="ft">${UI.provenance(u)}</div>
  </article>`;
}
function statusSelect(us) {
  return `<label class="sr-only" for="st-${us.id}">Status</label><select id="st-${us.id}" data-chg="usStatus" data-us="${us.id}" style="width:auto;min-height:32px;padding:3px 6px">${UNIT_STATUSES.map(s => opt(s, s[0].toUpperCase() + s.slice(1), us.status === s)).join('')}</select>`;
}

/* ------------------------------------ Classic record-sheet view (original) ---- */
function renderClassicSheet(u, opts = {}) {
  const c = u.classic; const us = opts.us; const side = opts.side || (us && us.side) || '';
  if (!c) return `<div class="notice warn">${E(Units.label(u))}: no Classic BattleTech data — ${E(t('unknown'))}.</div>`;
  const diss = Units.dissipation(c);
  const locBox = l => {
    const rear = CLASSIC_REAR.includes(l); const aMax = c.armor[l] ?? null; const iMax = rear ? null : (c.internal[l] ?? null);
    const aCur = us ? us.cbt.armor[l] : aMax; const iCur = us && !rear ? us.cbt.internal[l] : iMax;
    let cls = ''; if (us) { const baseLoc = rear ? l.slice(0, 2) : l; if (us.cbt.internal[baseLoc] <= 0) cls = 'gone'; else if (!rear && iCur < iMax) cls = 'dmg2'; else if (aCur < aMax) cls = 'dmg1'; }
    const step = (kind, val) => `<span class="stepper"><button data-act="cbtLoc" data-us="${us.id}" data-loc="${l}" data-kind="${kind}" data-d="-1" aria-label="${LOC_NAMES[l]} ${kind} minus one">−</button><span class="val">${val}</span><button data-act="cbtLoc" data-us="${us.id}" data-loc="${l}" data-kind="${kind}" data-d="1" aria-label="${LOC_NAMES[l]} ${kind} plus one">+</button></span>`;
    const area = l.toLowerCase();
    return `<div class="loc ${cls}" style="grid-area:${area}" title="${E(LOC_NAMES[l])}"><span class="ln">${us ? E(LOC_NAMES[l]) : l}</span>
      ${us ? `<span class="row" style="gap:3px"><span class="lv"><span class="k">A</span></span>${step('armor', aCur ?? '—')}</span>${rear ? '' : `<span class="row" style="gap:3px"><span class="lv"><span class="k">IS</span></span>${step('internal', iCur ?? '—')}</span>`}`
        : `<span class="lv"><span class="k">A</span> ${aMax ?? '—'}</span>${rear ? '' : `<span class="lv"><span class="k">IS</span> ${iMax ?? '—'}</span>`}`}
      ${us && cls === 'gone' ? '<span class="tiny bad-t">destroyed</span>' : ''}</div>`;
  };
  const wrows = (c.weapons || []).map(w => {
    const dead = us && (us.cbt.destroyedWeapons[w.id] || RulesAdapterClassic.locDestroyed(us, w.loc));
    return `<tr class="${dead ? 'destroyed' : ''}">${us ? `<td><input type="checkbox" aria-label="${E(w.name)} destroyed" data-chg="cbtWeapon" data-us="${us.id}" data-w="${E(w.id)}"${us.cbt.destroyedWeapons[w.id] ? ' checked' : ''}></td>` : ''}<td>${E(w.name)}${w.cluster ? ' <span class="tag" title="Cluster weapon">CL</span>' : ''}${w.rear ? ' <span class="tag">R</span>' : ''}</td><td class="n">${E(w.loc || '—')}</td><td class="n">${E(w.heat)}</td><td class="n">${E(w.damage)}</td><td class="n">${w.min ? E(w.min) : '—'}</td><td class="n">${E(w.short)}</td><td class="n">${E(w.medium)}</td><td class="n">${E(w.long)}</td></tr>`;
  }).join('');
  const ammo = (c.ammo || []).map((a, i) => `<div class="row small"><span class="grow">${E(a.name || a.key)} <span class="dim">(${E(a.loc || '—')})</span></span>${us ? `<span class="stepper"><button class="xs" data-act="cbtAmmo" data-us="${us.id}" data-i="${i}" data-d="-1" aria-label="Use one shot">−</button><span class="val">${us.cbt.ammo[i]}</span><button class="xs" data-act="cbtAmmo" data-us="${us.id}" data-i="${i}" data-d="1" aria-label="Add one shot">+</button></span><span class="dim tiny">/ ${a.shots}</span>` : `<span class="mono">${a.shots} shots</span>`}</div>`).join('') || '<div class="dim small">No ammunition bins.</div>';
  const crits = c.crits && Object.keys(c.crits).length ? `<details class="box"><summary>Critical slots</summary><div class="crit-grid">${CLASSIC_LOCS.filter(l => c.crits[l]).map(l => `<div><b class="tiny">${LOC_NAMES[l]}</b><ol>${c.crits[l].map(x => `<li>${E(x)}</li>`).join('')}</ol></div>`).join('')}</div></details>` : '<div class="dim small">Critical slots: Unknown / not supplied.</div>';
  let heatBlk = `<div class="kv"><dt>Heat sinks</dt><dd>${E(c.heatSinks ?? '—')} ${E(c.heatSinkType || '')}</dd><dt>Dissipation</dt><dd>${diss ?? 'Unknown'} <span class="tag calc">calc</span></dd></div>`;
  if (us) heatBlk += `<div class="row" style="margin-top:6px"><span class="stepper"><button data-act="cbtHeat" data-us="${us.id}" data-d="-1" aria-label="Heat minus one">−</button><span class="val" style="font-size:1.2rem">${us.cbt.heat}</span><button data-act="cbtHeat" data-us="${us.id}" data-d="1" aria-label="Heat plus one">+</button></span><span class="small muted">current heat</span><span class="tag manual">manual</span></div>
    <button class="sm" data-act="cbtDissipate" data-us="${us.id}"${diss == null ? ' disabled' : ''}>Heat phase: subtract dissipation (−${diss ?? '?'})</button>
    <div class="tiny muted">Heat effects: consult your heat scale (Reference → Heat). Not applied automatically.</div>`;
  let pilot = `<div class="kv"><dt>Gunnery</dt><dd>${E(us ? us.gunnery : c.gunnery ?? '—')}</dd><dt>Piloting</dt><dd>${E(us ? us.piloting : c.piloting ?? '—')}</dd></div>`;
  if (us) pilot += `<div class="row" style="margin-top:4px"><span class="tiny muted">Hits</span>${[1, 2, 3, 4, 5, 6].map(h => `<button class="pip${us.cbt.pilotHits >= h ? ' hit' : ''}" data-act="cbtPilot" data-us="${us.id}" data-h="${h}" aria-label="Pilot hit ${h}"></button>`).join('')}</div>
    <label class="chk"><input type="checkbox" data-chg="cbtConscious" data-us="${us.id}"${us.cbt.conscious ? ' checked' : ''}> Conscious <span class="tag manual">manual</span></label>`;
  const move = `${c.walk ?? '—'} / ${Units.classicRun(c)} / ${c.jump ?? 0}`;
  return `<article class="sheet ${side}" aria-label="Record-sheet view ${E(Units.label(u))}">
    <div class="sh-hd"><b>${E(us ? us.name : u.name)}</b><span class="muted">${E(u.variant || '')}</span>${us ? `<span class="tag">${E(us.label)}</span>` : ''}<span class="spacer"></span><span class="mono">${E(c.tonnage ?? u.tonnage ?? '—')} t</span>${UI.tagsForUnit(u)}</div>
    <div class="sh-bd">
      <div class="stack">
        <div class="blk"><h4>Unit data</h4><div class="kv"><dt>Tech base</dt><dd>${E(c.techBase || u.techBase || '—')}</dd><dt>Era</dt><dd>${E(u.era || '—')}</dd><dt>Move W/R/J</dt><dd>${E(move)}</dd><dt>Role</dt><dd>${E(u.role || '—')}</dd>${c.bv != null ? `<dt>BV</dt><dd>${E(c.bv)}</dd>` : ''}</div></div>
        <div class="blk"><h4>Weapons &amp; equipment</h4><div style="overflow:auto"><table class="t wtable"><thead><tr>${us ? '<th title="Destroyed">✕</th>' : ''}<th>Weapon</th><th class="n">Loc</th><th class="n">Ht</th><th class="n">Dmg</th><th class="n">Min</th><th class="n">S</th><th class="n">M</th><th class="n">L</th></tr></thead><tbody>${wrows || `<tr><td colspan="9" class="dim">No weapons listed.</td></tr>`}</tbody></table></div>
          ${(c.equipment || []).length ? `<div class="small" style="margin-top:4px">Equipment: ${c.equipment.map(E).join(', ')}</div>` : ''}</div>
        ${us ? `<div class="blk"><h4>Status</h4><div class="row">${statusSelect(us)}<label class="small">Move <select data-chg="usMove" data-us="${us.id}" style="width:auto;min-height:32px;padding:3px 6px">${['none', 'stand', 'walk', 'run', 'jump'].map(m => opt(m, m, us.moveStatus === m)).join('')}</select></label><span class="tag manual">manual</span></div></div>` : ''}
      </div>
      <div class="stack">
        <div class="blk"><h4>Armor &amp; internal structure</h4><div class="armor-diagram${us ? ' live' : ''}">${(us ? ['HD', 'CT', 'LT', 'RT', 'LA', 'RA', 'LL', 'RL', 'CTR', 'LTR', 'RTR'] : ARMOR_LOCS).map(locBox).join('')}</div>${us ? `<div class="tiny muted" style="margin-top:4px">Manual damage tracking. Location shown destroyed when IS reaches 0 <span class="tag calc">calc</span></div>` : ''}</div>
        <div class="blk"><h4>Heat</h4>${heatBlk}</div>
        <div class="blk"><h4>Ammunition</h4>${ammo}</div>
        <div class="blk"><h4>Pilot</h4>${pilot}</div>
      </div>
    </div>
    <div style="padding:0 10px 8px">${crits}</div>${opts.entryCtl || ''}
    <div class="ascard" style="border:none;border-top:1px solid var(--line);border-radius:0"><div class="ft">${UI.provenance(u)} · Original layout — not an official record sheet.</div></div>
  </article>`;
}
</script>
<script>
'use strict';
const Views = {};

/* ========================================================== Dashboard ==== */
Views.dashboard = () => {
  const st = Store.state;
  const sessions = st.sessions.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  const active = sessions.find(s => s.status === 'active');
  const ds = Disk.status();
  const forceRows = ['as', 'classic'].map(rs => {
    const fs = st.forces.filter(f => f.ruleset === rs);
    return `<h3>${rsBadge(rs)}</h3>${fs.length ? `<div class="list">${fs.map(f => { const tt = Forces.totals(f, st.units); return `<div class="lrow ${f.role === 'enemy' ? 'enemy' : 'friendly'}"><div class="grow"><div class="name">${E(f.name)}</div><div class="stats">${tt.count} units · ${rs === 'as' ? tt.pv + ' PV' : tt.tonnage + ' t'} · ${E(f.role)}</div></div><button class="sm" data-act="openForce" data-force="${f.id}">Open</button></div>`; }).join('')}</div>` : UI.empty('No forces yet', `Build one in the ${RULESETS[rs].name} tab.`, `<button class="sm" data-act="goto" data-view="${rs}">Open ${RULESETS[rs].name}</button>`)}`;
  }).join('<hr class="sep">');
  return `<div class="view-title"><h1>Command dashboard</h1><span class="spacer"></span><button class="primary" data-act="newBattle">+ New battle</button></div>
  <div class="grid g3">
    <section class="panel"><h2>Continue</h2>${active ? `<div class="lrow"><div class="grow"><div class="name">${E(active.name)}</div><div class="stats">${E(RULESETS[active.ruleset].name)} · Turn ${active.turn} · ${E(BattleState.phaseName(active))} · ${E(active.friendlyForceName)} vs ${E(active.enemyForceName)}</div><div class="tiny dim">Updated ${E(U.fmtTime(active.updatedAt))}</div></div></div><div class="row" style="margin-top:8px"><button class="primary big" data-act="resumeSession" data-id="${active.id}">Resume battle</button></div>` : UI.empty('No battle in progress', 'Start a quick battle or set one up in detail.', '<button class="sm" data-act="newBattle">Set up a battle</button>')}</section>
    <section class="panel"><h2>Quick battle</h2><p class="small muted">Uses your current friendly and enemy forces for the ruleset (or the demo forces), a default table and automatic deployment. Everything can be changed later.</p>
      <div class="grid g2"><button class="big" data-act="quickBattle" data-rs="as">◆ Alpha Strike</button><button class="big" data-act="quickBattle" data-rs="classic">⬢ Classic</button></div></section>
    <section class="panel"><h2>Save to local disk</h2><p class="small"><span class="save-pill ${ds.cls}" style="cursor:default"><span class="dot"></span>${E(ds.text)}</span></p>
      <p class="small muted">${Disk.supported() ? 'Link a save file once; changes are then written to it automatically.' : 'This browser cannot write files directly — download a backup file to keep your data on disk.'}</p>
      <div class="row">${Disk.supported() ? (Disk.handle ? (Disk.needsPermission ? '<button class="primary" data-act="diskReconnect">Reconnect save file</button>' : '<button class="primary" data-act="saveNow">Save now</button>') : '<button class="primary" data-act="diskLink">Choose save file…</button>') : ''}<button data-act="diskDownload">Download backup</button><button data-act="diskOpen">Open save file…</button></div></section>
  </div>
  <div class="grid g2" style="margin-top:12px">
    <section class="panel"><h2>Saved forces</h2>${forceRows}</section>
    <section class="panel"><h2>Battles</h2>${sessions.length ? `<div class="list">${sessions.map(s => `<div class="lrow"><div class="grow"><div class="name">${E(s.name)} ${s.status === 'ended' ? '<span class="tag">ended</span>' : ''}</div><div class="stats">${E(RULESETS[s.ruleset].short)} · T${s.turn} · ${E(s.friendlyForceName)} vs ${E(s.enemyForceName)} · ${s.log.length} log entries</div></div><button class="sm" data-act="resumeSession" data-id="${s.id}">${s.status === 'ended' ? 'Review' : 'Resume'}</button><button class="sm danger" data-act="deleteSession" data-id="${s.id}" aria-label="Delete ${E(s.name)}">✕</button></div>`).join('')}</div>` : UI.empty('No battles saved', 'Battles are saved automatically as you play.')}</section>
  </div>
  <section class="panel" style="margin-top:12px"><h2>How to play solo with MechOps</h2>
    <ol class="small"><li><b>Build forces</b> in the Alpha Strike or Classic tab (friendly and enemy side by side).</li><li><b>Start a battle</b> (Solo Battle) — choose ruleset, forces, table size, scenario.</li><li><b>Place units</b> on the simple map or just type distances.</li><li>On enemy turns, ask the <b>solo assistant</b>; accept, pick an alternative, or override.</li><li><b>Resolve rolls</b> on the table with your rulebook; record damage and heat in the trackers.</li><li>Everything saves automatically to browser storage — link a <b>save file</b> to keep it on disk.</li></ol>
    <div class="notice warn small">The bundled units and weapons are <b>fictional demo data</b>, not official BattleTech statistics. Add your own authorised unit data in the Mech / Unit Library or import JSON.</div>
    <div class="notice small">Privacy: keep personal data (names, contact details, etc.) out of notes and callsigns. Exported files follow your organisation's classification and sharing rules.</div>
  </section>`;
};

/* ======================================================== Force builder ==== */
function builderView(rs) {
  const st = Store.state; const R = RULESETS[rs];
  const fid = st.ui[rs + 'Friendly'], eid = st.ui[rs + 'Enemy'];
  const tab = UI.tmp.builderTab[rs];
  const sub = [['lib', 'Library'], ['friendly', 'Friendly'], ['enemy', 'Enemy'], ['compare', 'Compare']].map(([k, l]) => `<button class="sm" data-act="builderTab" data-rs="${rs}" data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('');
  const f1 = Store.force(fid), f2 = Store.force(eid);
  return `<div class="view-title"><h1>${E(R.name)} forces</h1><span class="spacer"></span><button data-act="importForce" data-rs="${rs}">Import force…</button><button data-act="newBattle" data-rs="${rs}" class="primary">Start battle with these forces</button></div>
  <div class="rs-banner">${rsBadge(rs)}<span class="small">${rs === 'as' ? 'Alpha Strike card statistics only. Units without Alpha Strike data are hidden from this library.' : 'Classic record-sheet statistics only. Units without Classic data are hidden from this library.'} Changes save automatically.</span></div>
  <div class="subtabs" role="tablist">${sub}</div>
  <div class="builder">
    <section class="panel lib-panel bpanel ${tab === 'lib' ? 'active' : ''}" aria-label="Unit library">${libraryPanel(rs)}</section>
    <section class="panel friendly bpanel ${tab === 'friendly' ? 'active' : ''}" aria-label="Friendly force">${forcePanel(rs, 'friendly', f1)}</section>
    <section class="panel enemy bpanel ${tab === 'enemy' ? 'active' : ''}" aria-label="Enemy force">${forcePanel(rs, 'enemy', f2)}</section>
  </div>
  <section class="panel bpanel-compare" style="margin-top:12px">${comparePanel(rs, f1, f2)}</section>`;
}
Views.as = () => builderView('as');
Views.classic = () => builderView('classic');

function unitStatsLine(u, rs) {
  if (rs === 'as') { const a = u.alphaStrike; const d = a.damage; return `PV ${a.pv} · ${a.type} SZ${a.size} · MV ${Units.asMoves(a).label} · ${d.s}/${d.m}/${d.l}${d.e != null ? '/' + d.e : ''} · A${a.armor} S${a.structure}`; }
  const c = u.classic; return `${c.tonnage ?? u.tonnage ?? '?'} t · ${c.walk}/${Units.classicRun(c)}/${c.jump || 0} · ${(c.weapons || []).length} weapons · HS ${c.heatSinks ?? '?'}`;
}
function libraryPanel(rs) {
  const st = Store.state; const f = UI.tmp.lib[rs]; const q = f.q.trim().toLowerCase();
  const all = st.units; const withP = all.filter(u => Units.hasProfile(u, rs)); const hidden = all.length - withP.length;
  let list = withP.filter(u => (!q || `${u.name} ${u.variant} ${u.role} ${u.kind} ${(u.alphaStrike?.specials || []).join(' ')}`.toLowerCase().includes(q)) && (f.wc === 'all' || Units.weightClass(u) === f.wc));
  const key = { name: u => Units.label(u).toLowerCase(), pv: u => -(u.alphaStrike?.pv ?? 0), tons: u => -((u.classic?.tonnage ?? u.tonnage) ?? 0), size: u => -(u.alphaStrike?.size ?? 0) }[f.sort] || (u => u.name);
  list.sort((a, b) => { const x = key(a), y = key(b); return x > y ? 1 : x < y ? -1 : 0; });
  return `<div class="panel-head"><h2>Unit library</h2><span class="spacer"></span><button class="sm" data-act="newUnit" data-rs="${rs}">+ New unit</button></div>
  <div class="row"><div class="field" style="flex:2;min-width:150px"><label for="lib-q-${rs}">Search</label><input id="lib-q-${rs}" type="search" placeholder="Name, role, special…" value="${E(f.q)}" data-inp="libQ" data-rs="${rs}"></div>
  <div class="field" style="flex:1;min-width:110px"><label for="lib-wc-${rs}">Weight</label><select id="lib-wc-${rs}" data-chg="libF" data-rs="${rs}" data-k="wc">${['all', 'light', 'medium', 'heavy', 'assault', 'unknown'].map(x => opt(x, x, f.wc === x)).join('')}</select></div>
  <div class="field" style="flex:1;min-width:110px"><label for="lib-sort-${rs}">Sort</label><select id="lib-sort-${rs}" data-chg="libF" data-rs="${rs}" data-k="sort">${(rs === 'as' ? [['name', 'Name'], ['pv', 'PV (high→low)'], ['size', 'Size']] : [['name', 'Name'], ['tons', 'Tonnage']]).map(([v, l]) => opt(v, l, f.sort === v)).join('')}</select></div></div>
  <p class="tiny muted">${list.length} shown${hidden ? ` · ${hidden} hidden (no ${RULESETS[rs].name} data)` : ''}</p>
  <div class="list scroll">${list.length ? list.map(u => `<div class="lrow"><div class="grow"><div class="name">${E(Units.label(u))} ${UI.tagsForUnit(u)}</div><div class="stats">${E(unitStatsLine(u, rs))}</div></div>
    <div class="row"><button class="sm friend" data-act="addToForce" data-rs="${rs}" data-side="friendly" data-unit="${u.id}" aria-label="Add ${E(Units.label(u))} to friendly force">+ Friendly</button><button class="sm enemy" data-act="addToForce" data-rs="${rs}" data-side="enemy" data-unit="${u.id}" aria-label="Add ${E(Units.label(u))} to enemy force">+ Enemy</button><button class="sm" data-act="viewUnit" data-unit="${u.id}" data-rs="${rs}">Details</button></div></div>`).join('') : UI.empty('No matching units', q ? 'Try a different search or filter.' : `Add units with ${RULESETS[rs].name} data in the Mech / Unit Library.`, '<button class="sm" data-act="goto" data-view="units">Open unit library</button>')}</div>`;
}
function forcePanel(rs, side, force) {
  const st = Store.state; const forces = st.forces.filter(f => f.ruleset === rs);
  const title = side === 'friendly' ? t('side.friendly') : t('side.enemy');
  const sel = `<label class="sr-only" for="fsel-${rs}-${side}">Choose ${side} force</label><select id="fsel-${rs}-${side}" data-chg="selectForce" data-rs="${rs}" data-side="${side}" style="width:auto;max-width:190px">${opt('', '— none —', !force)}${forces.map(f => opt(f.id, f.name + (f.role !== side ? ` (${f.role})` : ''), force && force.id === f.id)).join('')}</select>`;
  const head = `<div class="panel-head"><h2 class="side-title">${E(title)}</h2><span class="spacer"></span>${sel}<button class="sm" data-act="newForce" data-rs="${rs}" data-side="${side}">+ New</button></div>`;
  if (!force) return head + UI.empty(`No ${side} force selected`, 'Create a new force or pick a saved one, then add units from the library.', `<button class="sm ${side === 'friendly' ? 'friend' : 'enemy'}" data-act="newForce" data-rs="${rs}" data-side="${side}">Create ${side} force</button>`);
  const tot = Forces.totals(force, st.units); const warns = Forces.limitWarnings(force, tot); const compact = UI.tmp.compact[rs];
  const L = force.limits || {};
  const entries = force.entries.map(en => {
    const u = Store.unit(en.unitId);
    const ctl = `<div class="ctl" style="padding:6px 9px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="stepper" title="Quantity"><button class="xs" data-act="entryQty" data-force="${force.id}" data-entry="${en.id}" data-d="-1" aria-label="Decrease quantity">−</button><span class="val">×${en.qty || 1}</span><button class="xs" data-act="entryQty" data-force="${force.id}" data-entry="${en.id}" data-d="1" aria-label="Increase quantity">+</button></span>
      ${rs === 'as' ? `<label class="small">Skill <input class="num-s" type="number" min="0" max="8" value="${E(en.skill ?? 4)}" data-chg="entryF" data-force="${force.id}" data-entry="${en.id}" data-k="skill" data-type="num"></label><label class="small" title="PV adjusted for skill is not calculated — enter it here if needed">PV adj. <input class="num-s" type="number" min="0" value="${E(en.pvOverride ?? '')}" placeholder="${u && u.alphaStrike ? u.alphaStrike.pv : ''}" data-chg="entryF" data-force="${force.id}" data-entry="${en.id}" data-k="pvOverride" data-type="numnull"></label>`
        : `<label class="small">G <input class="num-s" type="number" min="0" max="8" value="${E(en.gunnery ?? 4)}" data-chg="entryF" data-force="${force.id}" data-entry="${en.id}" data-k="gunnery" data-type="num"></label><label class="small">P <input class="num-s" type="number" min="0" max="8" value="${E(en.piloting ?? 5)}" data-chg="entryF" data-force="${force.id}" data-entry="${en.id}" data-k="piloting" data-type="num"></label>`}
      <label class="small">Callsign <input style="width:100px;min-height:32px;padding:3px 6px" value="${E(en.callsign || '')}" data-chg="entryF" data-force="${force.id}" data-entry="${en.id}" data-k="callsign" data-type="text" maxlength="24"></label>
      <span class="spacer"></span><button class="xs" data-act="entryDup" data-force="${force.id}" data-entry="${en.id}" title="Duplicate">⧉</button><button class="xs danger" data-act="entryRemove" data-force="${force.id}" data-entry="${en.id}" title="Remove" aria-label="Remove entry">✕</button></div>`;
    if (!u) return `<div class="notice bad small">Missing unit “${E(en.unitId)}” (deleted or not imported).${ctl}</div>`;
    if (!Units.hasProfile(u, rs)) return `<div class="notice warn small">${E(Units.label(u))} has no ${E(RULESETS[rs].name)} data — it cannot be used in this ruleset.${ctl}</div>`;
    if (compact) return `<div class="lrow ${side}" style="flex-direction:column;align-items:stretch;padding:0"><div class="row" style="padding:6px 9px"><b>${E(Units.label(u))}</b>${en.callsign ? `<span class="tag">${E(en.callsign)}</span>` : ''}<span class="stats">${E(unitStatsLine(u, rs))}</span><span class="spacer"></span><button class="xs" data-act="viewUnit" data-unit="${u.id}" data-rs="${rs}">View</button></div>${ctl}</div>`;
    return rs === 'as' ? renderASCard(u, { side, entry: en, key: en.id, entryCtl: ctl }) : renderClassicSheetSummary(u, side, ctl);
  }).join('');
  return `${head}
    <div class="field"><label for="fname-${force.id}">Force name</label><input id="fname-${force.id}" value="${E(force.name)}" data-chg="forceF" data-force="${force.id}" data-k="name" maxlength="60"></div>
    <div class="row" style="margin:8px 0"><button class="sm" data-act="cloneForce" data-force="${force.id}">Clone</button><button class="sm" data-act="exportForce" data-force="${force.id}">Export JSON</button><button class="sm" data-act="toggleCompact" data-rs="${rs}" aria-pressed="${compact}">Compact roster</button><span class="spacer"></span><button class="sm danger" data-act="deleteForce" data-force="${force.id}">Delete</button></div>
    <div class="row mono" style="font-size:.95rem;margin-bottom:6px"><b>${tot.count}</b> units ${rs === 'as' ? `· <b>${tot.pv}</b> PV` : ''} · ${tot.tonKnown ? `<b>${tot.tonnage}</b> t` : `${tot.tonnage}+ t (some unknown)`}</div>
    ${warns.map(w => `<div class="notice warn small">${E(w)}</div>`).join('')}
    <details class="box" style="margin-bottom:8px"><summary>Force limits (warnings only)</summary><div class="form-grid" style="margin-top:6px">
      ${rs === 'as' ? `<div class="field"><label>Max PV</label><input type="number" min="0" value="${E(L.pv ?? '')}" data-chg="forceLimit" data-force="${force.id}" data-k="pv"></div>` : `<div class="field"><label>Max tonnage</label><input type="number" min="0" value="${E(L.tonnage ?? '')}" data-chg="forceLimit" data-force="${force.id}" data-k="tonnage"></div>`}
      <div class="field"><label>Max units</label><input type="number" min="0" value="${E(L.units ?? '')}" data-chg="forceLimit" data-force="${force.id}" data-k="units"></div></div></details>
    ${rs === 'as' ? '<p class="tiny muted">PV shown is the unit\'s base PV from its data. Skill-based PV adjustment is not calculated — enter an adjusted PV per unit if your game uses one.</p>' : ''}
    <div class="${rs === 'as' && !compact ? 'as-cards' : 'list'}">${entries || UI.empty('No units yet', `Use “+ ${side === 'friendly' ? 'Friendly' : 'Enemy'}” in the library to add units.`)}</div>
    <div class="field" style="margin-top:8px"><label for="fnotes-${force.id}">Notes</label><textarea id="fnotes-${force.id}" data-chg="forceF" data-force="${force.id}" data-k="notes" style="min-height:50px">${E(force.notes || '')}</textarea></div>`;
}
function renderClassicSheetSummary(u, side, ctl) {
  const c = u.classic; const armorTot = U.sum(ARMOR_LOCS.map(l => c.armor[l] || 0)); const isTot = U.sum(CLASSIC_LOCS.map(l => c.internal[l] || 0));
  return `<article class="sheet ${side}"><div class="sh-hd"><b>${E(u.name)}</b><span class="muted">${E(u.variant || '')}</span><span class="spacer"></span><span class="mono">${E(c.tonnage ?? '—')} t</span>${UI.tagsForUnit(u)}</div>
    <div style="padding:8px 10px" class="small"><div class="kv"><dt>Move W/R/J</dt><dd>${c.walk}/${Units.classicRun(c)}/${c.jump || 0}</dd><dt>Armor / IS</dt><dd>${armorTot} / ${isTot}</dd><dt>Heat sinks</dt><dd>${E(c.heatSinks ?? '—')} (diss. ${Units.dissipation(c) ?? '?'})</dd><dt>Weapons</dt><dd>${(c.weapons || []).map(w => E(w.name)).join(', ') || '—'}</dd></div>
    <button class="sm" style="margin-top:6px" data-act="viewUnit" data-unit="${u.id}" data-rs="classic">Open record sheet</button></div>${ctl}</article>`;
}
function comparePanel(rs, f1, f2) {
  const st = Store.state;
  if (!f1 || !f2) return `<h2>Compare forces</h2>${UI.empty('Pick both forces', 'Select a friendly and an enemy force to compare them.')}`;
  const a = Forces.totals(f1, st.units), b = Forces.totals(f2, st.units);
  const row = (l, x, y) => `<tr><th>${l}</th><td class="n">${x}</td><td class="n">${y}</td></tr>`;
  const wcs = ['light', 'medium', 'heavy', 'assault', 'unknown'];
  let diff = '';
  if (rs === 'as' && a.pv && b.pv) { const r = a.pv / b.pv; diff = `PV ratio ${U.round(r, 2)} : 1 (${a.pv > b.pv ? 'friendly' : b.pv > a.pv ? 'enemy' : 'neither'} side has more PV).`; }
  else if (rs === 'classic' && a.tonnage && b.tonnage) diff = `Tonnage ratio ${U.round(a.tonnage / b.tonnage, 2)} : 1.`;
  return `<h2>Compare forces</h2><div style="overflow:auto"><table class="t"><thead><tr><th></th><th class="n" style="color:var(--friend)">${E(f1.name)}</th><th class="n" style="color:var(--enemy)">${E(f2.name)}</th></tr></thead><tbody>
    ${row('Units', a.count, b.count)}${rs === 'as' ? row('Total PV', a.pv, b.pv) : ''}${row('Tonnage', a.tonnage + (a.tonKnown ? '' : '+'), b.tonnage + (b.tonKnown ? '' : '+'))}
    ${wcs.filter(w => a.comp[w] || b.comp[w]).map(w => row(w[0].toUpperCase() + w.slice(1), a.comp[w] || 0, b.comp[w] || 0)).join('')}</tbody></table></div>
    <p class="small">${E(diff)}</p><p class="tiny muted">${rs === 'as' ? 'PV' : 'Tonnage'} and composition alone do not guarantee a balanced game — terrain, scenario, skills and unit roles matter too.</p>`;
}
</script>
<script>
'use strict';
/* ======================================================== Solo Battle ==== */
function nbState() {
  const st = Store.state;
  if (!UI.tmp.nb) {
    const rs = st.settings.defaultRuleset || 'as'; const p = MAP_PRESETS[rs][rs === 'as' ? 1 : 1];
    UI.tmp.nb = { name: '', ruleset: rs, friendlyForceId: st.ui[rs + 'Friendly'] || '', enemyForceId: st.ui[rs + 'Enemy'] || '', preset: p.id, width: p.width, height: p.height, scenario: 'standup', description: '', objX: '', objY: '', deploy: 'auto', optional: [], personality: 'balanced' };
  }
  return UI.tmp.nb;
}
Views.battle = () => {
  const s = Store.session(Store.state.ui.activeSessionId);
  return s ? battleActive(s) : battleSetup();
};
function battleSetup() {
  const st = Store.state; const nb = nbState(); const rs = nb.ruleset;
  const forces = st.forces.filter(f => f.ruleset === rs);
  const fwarn = id => { const f = Store.force(id); if (!f) return ''; const tt = Forces.totals(f, st.units); return tt.missing.length ? `<div class="notice warn small">${tt.missing.map(m => E(m.reason) + ': ' + E((Store.unit(m.entry.unitId) || {}).name || m.entry.unitId)).join('<br>')} — these entries will be skipped.</div>` : `<div class="tiny muted">${tt.count} units · ${rs === 'as' ? tt.pv + ' PV' : tt.tonnage + ' t'}</div>`; };
  const sc = SCENARIOS.find(x => x.id === nb.scenario) || SCENARIOS[0];
  const sessions = st.sessions.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  const unitWord = rs === 'as' ? 'inches' : 'hexes';
  return `<div class="view-title"><h1>Solo battle</h1></div>
  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(260px,1fr)">
  <section class="panel"><h2>New battle</h2>
    <div class="stack">
      <div><h3>1 · Ruleset</h3><div class="row" role="radiogroup" aria-label="Ruleset">${['as', 'classic'].map(r => `<button class="${nb.ruleset === r ? 'primary' : ''}" data-act="nbRuleset" data-rs="${r}" aria-pressed="${nb.ruleset === r}">${r === 'as' ? '◆' : '⬢'} ${E(RULESETS[r].name)}</button>`).join('')}</div></div>
      <div><h3>2 · Forces</h3><div class="grid g2">
        <div class="field"><label for="nb-ff" style="color:var(--friend)">Friendly force</label><select id="nb-ff" data-chg="nb" data-k="friendlyForceId">${opt('', '— choose —', !nb.friendlyForceId)}${forces.map(f => opt(f.id, f.name, f.id === nb.friendlyForceId)).join('')}</select>${fwarn(nb.friendlyForceId)}</div>
        <div class="field"><label for="nb-ef" style="color:var(--enemy)">Enemy force (assistant-controlled)</label><select id="nb-ef" data-chg="nb" data-k="enemyForceId">${opt('', '— choose —', !nb.enemyForceId)}${forces.map(f => opt(f.id, f.name, f.id === nb.enemyForceId)).join('')}</select>${fwarn(nb.enemyForceId)}</div></div>
        ${forces.length ? '' : `<div class="notice warn small">No ${E(RULESETS[rs].name)} forces yet. <button class="sm" data-act="goto" data-view="${rs}">Build forces</button></div>`}</div>
      <div><h3>3 · Battlefield</h3><div class="form-grid">
        <div class="field" style="grid-column:span 2"><label for="nb-preset">Table / map</label><select id="nb-preset" data-chg="nbPreset">${MAP_PRESETS[rs].map(p => opt(p.id, p.label, nb.preset === p.id)).join('')}</select></div>
        <div class="field"><label for="nb-w">Width (${unitWord})</label><input id="nb-w" type="number" min="4" max="${rs === 'as' ? 144 : 64}" value="${E(nb.width)}" data-chg="nb" data-k="width" data-type="num"${nb.preset !== 'custom' ? ' disabled' : ''}></div>
        <div class="field"><label for="nb-h">Height (${unitWord})</label><input id="nb-h" type="number" min="4" max="${rs === 'as' ? 144 : 64}" value="${E(nb.height)}" data-chg="nb" data-k="height" data-type="num"${nb.preset !== 'custom' ? ' disabled' : ''}></div>
        <div class="field"><label for="nb-dep">Starting positions</label><select id="nb-dep" data-chg="nb" data-k="deploy">${opt('auto', 'Auto: opposite long edges', nb.deploy === 'auto')}${opt('manual', 'Manual: I will place units', nb.deploy === 'manual')}</select></div></div>
        <p class="tiny muted">Terrain is not simulated — note it in the assistant's context, and resolve its effects with your rulebook.</p></div>
      <div><h3>4 · Scenario</h3><div class="form-grid">
        <div class="field"><label for="nb-sc">Scenario type</label><select id="nb-sc" data-chg="nb" data-k="scenario">${SCENARIOS.map(x => opt(x.id, x.name, nb.scenario === x.id)).join('')}</select></div>
        <div class="field"><label for="nb-ox">Objective X</label><input id="nb-ox" type="number" min="0" value="${E(nb.objX)}" data-chg="nb" data-k="objX" placeholder="optional"></div>
        <div class="field"><label for="nb-oy">Objective Y</label><input id="nb-oy" type="number" min="0" value="${E(nb.objY)}" data-chg="nb" data-k="objY" placeholder="optional"></div></div>
        <div class="notice small"><span class="tag ${sc.support === 'supported' ? 'calc' : sc.support === 'partial' ? 'heur' : 'manual'}">${E(sc.support)}</span> ${E(sc.note)}</div>
        <div class="field"><label for="nb-desc">Scenario notes / victory conditions</label><textarea id="nb-desc" data-chg="nb" data-k="description" style="min-height:50px">${E(nb.description)}</textarea></div></div>
      <div><h3>5 · Optional rules</h3><p class="tiny muted">MechOps does not simulate these; ticking one records it as a reminder in the session.</p><div class="row">${OPTIONAL_RULES.map(o => `<label class="chk"><input type="checkbox" data-chg="nbOpt" data-id="${o.id}"${nb.optional.includes(o.id) ? ' checked' : ''}> ${E(o.name)} <span class="tag unsup">not simulated</span></label>`).join('')}</div></div>
      <div><h3>6 · Enemy behaviour &amp; name</h3><div class="form-grid">
        <div class="field"><label for="nb-pers">Tactical personality</label><select id="nb-pers" data-chg="nb" data-k="personality">${Object.entries(PERSONALITIES).map(([k, p]) => opt(k, p.name, nb.personality === k)).join('')}</select></div>
        <div class="field" style="grid-column:span 2"><label for="nb-name">Battle name</label><input id="nb-name" value="${E(nb.name)}" placeholder="${E(RULESETS[rs].name)} battle" data-chg="nb" data-k="name" maxlength="60"></div></div>
        <p class="tiny muted">${E(PERSONALITIES[nb.personality].desc)} (Gameplay heuristic, not a BattleTech rule.)</p></div>
      <div class="row"><button class="primary big" data-act="startBattle">Start battle</button><button class="big" data-act="quickBattle" data-rs="${rs}">Quick battle (defaults)</button></div>
    </div></section>
  <section class="panel"><h2>Saved battles</h2>${sessions.length ? `<div class="list">${sessions.map(s => `<div class="lrow"><div class="grow"><div class="name">${E(s.name)}</div><div class="stats">${E(RULESETS[s.ruleset].short)} · T${s.turn} ${E(BattleState.phaseName(s))} · ${s.status}</div></div><button class="sm" data-act="resumeSession" data-id="${s.id}">Open</button></div>`).join('')}</div>` : UI.empty('None yet', 'Battles you start appear here and save automatically.')}</section>
  </div>`;
}

function battleActive(s) {
  const tab = UI.tmp.battleTab; const R = RULESETS[s.ruleset];
  const phases = PHASES[s.ruleset].map((p, i) => `<span class="tag${i === s.phaseIndex ? ' user' : ''}" style="${i === s.phaseIndex ? 'background:var(--accent);color:var(--accent-ink)' : ''}">${E(p)}</span>`).join(' ');
  const tabs = [['map', 'Map'], ['units', 'Units'], ['assist', 'Assistant'], ['log', 'Log & tools']].map(([k, l]) => `<button class="sm" data-act="battleTab" data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('');
  return `<div class="panel" style="margin-bottom:12px">
    <div class="row">${rsBadge(s.ruleset)}<h1 style="margin:0;font-size:1.1rem">${E(s.name)}</h1>${s.status === 'ended' ? '<span class="tag">ended</span>' : ''}<span class="spacer"></span>
      <button class="sm" data-act="saveNow">Save</button><button class="sm" data-act="closeSession">Close</button><button class="sm" data-act="${s.status === 'ended' ? 'reopenSession' : 'endSession'}">${s.status === 'ended' ? 'Reopen' : 'End battle'}</button><button class="sm danger" data-act="deleteSession" data-id="${s.id}">Delete</button></div>
    <div class="row" style="margin-top:8px"><span class="mono" style="font-size:1.15rem"><b>TURN ${s.turn}</b></span><span>${phases}</span><button class="sm primary" data-act="nextPhase">Next phase ▸</button>
      <span class="spacer"></span><span class="small muted">Active side</span><button class="sm friend" data-act="activeSide" data-side="friendly" aria-pressed="${s.activeSide === 'friendly'}">Friendly</button><button class="sm enemy" data-act="activeSide" data-side="enemy" aria-pressed="${s.activeSide === 'enemy'}">Enemy</button></div>
    <div class="tiny muted" style="margin-top:4px">${E(s.friendlyForceName)} vs ${E(s.enemyForceName)} · ${s.map.width}×${s.map.height} ${s.map.unit === 'hex' ? 'hexes' : 'inches'} · scenario: ${E((SCENARIOS.find(x => x.id === s.scenario.type) || {}).name || s.scenario.type)}${s.options.optionalRules.length ? ' · optional rules (not simulated): ' + s.options.optionalRules.map(id => E((OPTIONAL_RULES.find(o => o.id === id) || {}).name || id)).join(', ') : ''}</div>
    ${s.scenario.description ? `<div class="small" style="margin-top:4px">${E(s.scenario.description)}</div>` : ''}
    ${(s.warnings || []).map(w => `<div class="notice warn small">${E(w)}</div>`).join('')}
  </div>
  <div class="subtabs battle-tabs">${tabs}</div>
  <div class="battle-layout">
    <div class="stack" style="min-width:0">
      <section class="panel bpanel ${tab === 'map' ? 'active' : ''}" aria-label="Map">${mapPanel(s)}</section>
      <section class="panel bpanel ${tab === 'units' ? 'active' : ''}" aria-label="Units">${unitsPanel(s)}</section>
    </div>
    <div class="stack" style="min-width:0">
      <section class="panel bpanel ${tab === 'assist' ? 'active' : ''}" aria-label="Solo assistant">${assistantPanel(s)}</section>
      <section class="panel bpanel ${tab === 'log' ? 'active' : ''}" aria-label="Log and tools">${logPanel(s)}</section>
    </div>
  </div>`;
}

/* ------------------------------------------------------------- map ---- */
function mapPanel(s) {
  const sel = BattleState.getUnit(s, UI.tmp.selectedUS);
  const W = s.map.width, H = s.map.height; let svg;
  const hex = s.map.unit === 'hex';
  const tokR = hex ? 0.62 : Math.max(0.55, Math.min(W, H) / 40);
  const tokens = s.units.filter(BattleState.placed).map(u => {
    const c = BattleState.center(s, u); const ang = Geo.facingAngle(u.facing) * Math.PI / 180;
    const fx = c.x + Math.cos(ang) * tokR * 1.6, fy = c.y + Math.sin(ang) * tokR * 1.6;
    return `<g class="tok ${u.side === 'friendly' ? 'f' : 'e'}${u.id === UI.tmp.selectedUS ? ' sel' : ''}${BattleState.operational(u) ? '' : ' dead'}" data-act="selectUS" data-us="${u.id}" role="button" aria-label="${E(u.name)}">
      <line class="facing" x1="${c.x}" y1="${c.y}" x2="${U.round(fx, 2)}" y2="${U.round(fy, 2)}"></line><circle cx="${c.x}" cy="${c.y}" r="${tokR}"></circle>
      <text x="${c.x}" y="${c.y + tokR * 0.35}" text-anchor="middle" font-size="${U.round(tokR * 0.95, 2)}">${E(u.label)}</text><title>${E(u.name)} (${E(u.status)})</title></g>`;
  }).join('');
  let lines = '';
  if (sel && BattleState.placed(sel)) {
    const a = BattleState.center(s, sel);
    s.units.filter(u => u.side !== sel.side && BattleState.placed(u) && BattleState.operational(u)).forEach(u => {
      const b = BattleState.center(s, u); const d = BattleState.mapDistance(s, sel, u);
      lines += `<line class="rangeline" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line><text class="rangelbl" x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 0.3}" text-anchor="middle" font-size="${U.round(tokR * 1.1, 2)}">${d}${hex ? 'h' : '"'}</text>`;
    });
  }
  let obj = '';
  const o = s.scenario.objective; if (o && isNum(o.x)) { const c = hex ? Geo.hexCenter(o.x, o.y) : o; obj = `<circle class="obj" cx="${c.x}" cy="${c.y}" r="${tokR * 1.6}"></circle><text x="${c.x}" y="${c.y + tokR * 2.6}" text-anchor="middle" font-size="${U.round(tokR, 2)}" style="fill:var(--ok)">OBJ</text>`; }
  if (hex) {
    const vw = 1.5 * W + 0.5, vh = Geo.SQ3 * (H + 0.5); let hexes = '';
    for (let c = 0; c < W; c++) for (let r = 0; r < H; r++) {
      const ce = Geo.hexCenter(c, r); const pts = [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 180 * 60 * i; return `${U.round(ce.x + Math.cos(a), 3)},${U.round(ce.y + Math.sin(a), 3)}`; }).join(' ');
      hexes += `<polygon class="hex" points="${pts}" data-act="hexClick" data-x="${c}" data-y="${r}"></polygon>`;
    }

function renderReco(s, res) {
  if (!res.ok) return `<div class="notice bad" style="margin-top:10px"><b>Cannot recommend yet.</b><ul>${res.errors.map(e => `<li>${E(e)}</li>`).join('')}</ul>${res.missing && res.missing.length ? `<b>Missing information</b><ul>${res.missing.map(m => `<li>${E(m.q)}</li>`).join('')}</ul>` : ''}</div>`;

  const moveMap = isAS ? { hold: 'stand', ground: 'ground', jump: 'jump' } : { hold: 'stand', walk: 'walk', run: 'run', jump: 'jump' };
  const maxC = Math.max(0.01, ...r.breakdown.map(b => b.contrib));
  const ammoWeapons = res.ammoWeapons || [];
  return `<div class="reco" style="margin-top:12px">
    <div class="row"><span class="tag heur">AI heuristic recommendation</span><span class="tag ${r.legality === 'plausible' ? 'calc' : 'heur'}">${r.legality === 'plausible' ? 'plausibly legal' : 'needs rule check'}</span><span class="spacer"></span><span class="tiny muted">option ${r.idx + 1} of ${n}${res.reroll ? ` · re-roll #${res.reroll}` : ''}</span></div>
    <div class="headline">${E(acting ? acting.label + ' · ' : '')}${E(r.headline)}</div>
    <h4>Why</h4><ul>${li(r.why)}</ul>

    <h4>Assumptions</h4><ul>${li(r.assumptions)}</ul>
    ${r.missing.length ? `<h4>Missing information</h4><ul>${r.missing.map(m => `<li>${E(m.q)}</li>`).join('')}</ul>` : ''}

    <details class="box" style="margin-top:8px"><summary>Score breakdown (transparent weighting)</summary><table class="t"><thead><tr><th>Factor</th><th class="n">Value</th><th class="n">Weighted</th><th></th></tr></thead><tbody>

      <tr><th>Total</th><td></td><th class="n">${U.round(r.score, 2)}</th><td></td></tr></tbody></table>
      <p class="tiny muted">Personality “${E(PERSONALITIES[s.ai.personality].name)}”, risk ${Math.round(s.ai.risk * 100)}%. Weights are AI heuristics (see Docs).</p></details>
    <details class="box" style="margin-top:6px"><summary>Not simulated by the ${E(RULESETS[s.ruleset].name)} adapter (${r.unsupported.length})</summary><ul class="small">${li(r.unsupported)}</ul></details>
    <h4>Apply</h4>
    <div class="row small">
      ${heatGain ? `<label class="chk"><input type="checkbox" id="ac-heat" checked> Record +${heatGain} heat${isAS ? '' : ' (movement + weapons; dissipation applies in the Heat phase)'}</label>` : ''}

}
function refSourceLine(r) { const ds = dsById(r.source && r.source.dataSourceId); return `<div class="src">Source: ${E(ds ? ds.title : 'Unknown')}${ds && ds.edition ? ' · ' + E(ds.edition) : ''}${r.source && r.source.page ? ' · p. ' + E(r.source.page) : ''}</div>`; }
</script>
<script>
'use strict';
/* ==================================================== Reference Library ==== */
const RS_LABEL = { as: 'Alpha Strike', classic: 'Classic', both: 'Both', general: 'General' };
function refFiltered() {
  const st = Store.state; const f = UI.tmp.ref; const q = f.q.toLowerCase().trim();

    <div class="body"><div class="tiny muted">${E(cat ? cat.name : r.category)}${r.edition ? ' · edition ' + E(r.edition) : ''}</div><p>${E(r.body)}</p>

        <span class="spacer"></span><button class="sm" data-act="favRef" data-id="${r.id}" aria-pressed="${!!r.favourite}">★ Favourite</button>
        <button class="sm" data-act="pinRef" data-id="${r.id}" aria-pressed="${!!pinned}"${sess ? '' : ' disabled title="Start a battle to pin references"'}>📌 ${pinned ? 'Pinned' : 'Pin to battle'}</button>
        ${editable ? `<button class="sm" data-act="editRef" data-id="${r.id}">Edit</button><button class="sm danger" data-act="deleteRef" data-id="${r.id}">Delete</button>` : `<button class="sm" data-act="copyRef" data-id="${r.id}" title="Make an editable personal copy">Copy as note</button>`}</div></div></details>`;

function parseRows(text) {
  return String(text || '').split(/\r?\n/).filter(l => l.trim()).map(line => {
    if (line.includes('\t')) return line.split('\t').map(x => x.trim());
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) { const ch = line[i]; if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; } else if (ch === ',' && !q) { out.push(cur.trim()); cur = ''; } else cur += ch; }
    out.push(cur.trim()); return out;
  });
}

function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
function castVal(v, type) { if (type === 'num') return U.num(v, 0); if (type === 'numnull') return U.numOrNull(v); if (type === 'textnull') return String(v).trim() || null; return String(v); }
function parseMove(str) { const out = []; String(str).split('/').forEach(p => { const m = p.trim().match(/^(\d+(?:\.\d+)?)\s*"?\s*([a-z]*)$/i); if (m) out.push({ inches: Number(m[1]), mode: m[2].toLowerCase() }); }); return out; }

Views.docs = () => {

  <div class="grid g2">
  <section class="panel"><h2>Stack &amp; assumptions</h2>
    <p class="small">MechOps Solo is delivered as <b>one self-contained HTML file</b> (HTML + CSS + vanilla JavaScript, no external libraries, no network calls, no account). This keeps it usable offline beside the table and trivial to back up.</p>
    <ul class="small"><li>State lives in one JSON document (<code>Store.state</code>), mirrored to browser storage on every change and — when linked — written to a <b>save file on your disk</b> via the File System Access API.</li>

  <section class="panel"><h2>How to run</h2>

      <li>To move to another computer, copy the HTML file and your save JSON, then use <b>Open save file…</b>.</li>
      <li>Run the self-tests after editing the file: Settings &amp; Data → Run self-tests (or open the file with <code>#selftest</code> to run them on load and log to the console).</li></ol></section>

      ${[['U, I18N', 'Utilities, translation table (English; add a language object to I18N)'], ['DATA', 'Fictional demo dataset, reference seed, data sources'], ['Schema', 'Validation of units, forces, reference entries and import bundles'], ['Store / Disk / IDB', 'State, migration, browser storage, disk save file, backups'], ['Importer', 'Analyse imports, detect duplicates, merge/skip/replace'], ['Units / Forces', 'Unit helpers, force totals, limits, export bundles'], ['BattleState', 'Sessions, unit battle state (snapshots), positions, distances, arcs, phases'], ['RulesAdapterAlphaStrike / RulesAdapterClassic', 'Ruleset-specific calculations (bands, brackets, heat, movement options, rule-check lists)'], ['SoloContext', 'Reads battle state; lists missing information and assumptions'], ['CandidateActionGenerator', 'Generates hold/advance/close/flank/withdraw/cover/jump/objective/physical/overheat/cool-down candidates'], ['ActionLegalityChecker', 'Drops impossible options, flags “needs rule check” conditions'], ['TacticalScorer', 'Weighted, transparent scoring by personality, risk and priorities'], ['RecommendationExplainer', 'Plain-language why / risks / assumptions / rule checks / alternatives'], ['TurnLog', 'Turn-by-turn log and Markdown export'], ['Views / Actions', 'UI rendering and event handling'], ['Tests', 'Self-test suite']].map(([a, b]) => row(`<code>${a}</code>`, E(b), null)).join('')}</tbody></table></section>

    <h3 class="ok-t">Implemented (calculated, tested)</h3><ul class="small"><li>Force totals: PV (base or your override), unit count, tonnage, weight-class composition, limit warnings</li><li>Distances on the map (inches; hex distance on an offset hex grid); hexless conversion</li><li>Alpha Strike range band from distance (editable band edges); damage after recorded weapon hits (−1 per hit default)</li><li>Classic weapon range bracket per weapon, minimum-range flag, ammo availability, heat totals (movement + weapons − dissipation)</li><li>2D6 “at least N” probability</li><li>Separation of battle damage from library data (snapshots)</li></ul>
    <h3 class="warn-t">Partially implemented</h3><ul class="small"><li>Firing arcs (Classic) approximated from facing; torso twist not modelled</li><li>Scenario objectives: objective point scoring only; victory tracked manually</li><li>Movement: straight-line, clear terrain; MP-crit halving optional; leg damage flagged, not applied</li><li>Physical attacks offered as option with an estimate only</li></ul>
    <h3 class="bad-t">Not supported (resolve with your rulebook)</h3><ul class="small"><li>To-hit numbers and all modifier tables</li><li>Terrain, elevation and automated line of sight</li><li>Hit location, cluster hits, criticals, damage transfer</li><li>Heat-scale effects, shutdown/ammo explosion checks</li><li>Piloting skill rolls, falls, consciousness</li><li>Special abilities / SPA effects, indirect fire, optional rules</li></ul></section>
  <section class="panel"><h2>Solo assistant — how it decides</h2><ol class="small"><li>Confirms ruleset, turn and phase (header) and the acting enemy unit.</li><li>Builds context: distances (map or typed), LOS, cover, objective. Missing distances are asked for; unknowns become stated assumptions.</li><li>Generates candidate actions per target and movement mode.</li><li>Legality checker drops impossible options and flags those needing a rule check.</li><li>Scores: damage (prioritising the most dangerous target), finishing, survival (estimated return fire, cover, movement), position (preferred range), mobility (denying the target its best range), objective; heat penalties. Personality weights × your priority sliders; risk tolerance scales survival.</li><li>Explains the top option and lists alternatives, assumptions, rule checks and unsupported mechanics.</li><li>You accept, choose an alternative, re-roll (seeded randomness) or override — all logged.</li></ol></section>
  <section class="panel"><h2>Adding your own data</h2><ul class="small"><li><b>Units:</b> Mech / Unit Library → New unit (form or JSON), or import a <code>mechops-units</code> file / plain JSON array of units.</li><li><b>Sources:</b> Settings &amp; Data → Data sources: add each rulebook / dataset you own; select it on units and reference entries.</li><li><b>Reference:</b> Reference Library → + Entry / + House rule / + Table (paste rows from a spreadsheet). Use content type “Licensed” only for material you are authorised to use.</li><li><b>Record-sheet PDFs</b> you own stay in your folder; this app does not parse them — copy the values you need into the unit editor.</li></ul></section>
  <section class="panel"><h2>Roadmap (next phase)</h2><ul class="small"><li>Terrain layer on the map (woods/water/elevation) with LOS helper</li><li>To-hit calculator driven by user-entered modifier tables (with tests)</li><li>Damage helper applying hit-location results from user tables</li><li>Scenario presets with victory tracking; battle report view</li><li>Multi-unit enemy turn planner (focus fire, formation)</li><li>Optional LLM explanations via a server endpoint (never in this file)</li><li>Additional UI languages via I18N</li></ul></section>
  <section class="panel"><h2>Privacy &amp; reliability</h2><ul class="small"><li>No account, no tracking, no network requests. Data stays in this browser and in files you choose.</li><li>Every change is saved to browser storage immediately; a failed disk write keeps the in-memory and browser copy and shows a red indicator.</li><li>Do not put personal data in notes or callsigns; treat exported files according to your organisation's classification and release guidelines.</li></ul></section>
  </div>`;
};
</script>
<script>
'use strict';
/* ============================================================ Actions ==== */
const S = () => Store.session(Store.state.ui.activeSessionId);
const usOf = id => { const s = S(); return s ? BattleState.getUnit(s, id) : null; };
const touch = s => { if (s) s.updatedAt = U.now(); };
function forceEntry(fid, eid) { const f = Store.force(fid); return [f, f && f.entries.find(e => e.id === eid)]; }
function startImport(text, name) {
  let obj; try { obj = JSON.parse(text); } catch (e) { UI.toast(`“${name}” is not valid JSON: ${e.message}`, 'bad'); return; }
  UI.tmp.importAn = Importer.analyze(obj); UI.tmp.importRaw = obj; UI.tmp.importName = name; UI.tmp.importMode = 'merge'; UI.goto('settings');
  setTimeout(() => { const el = document.querySelector('[data-act="importApply"]'); if (el) el.scrollIntoView({ block: 'center' }); }, 50);
}
function storeResult(s, r, idx) {
  const c = r.ranked[idx];
  UI.tmp.result = { sessionId: s.id, actingId: UI.tmp.actingId, ok: r.ok, errors: r.errors, missing: r.ctx ? r.ctx.missing : [], reco: r.reco, count: r.ranked.length, reroll: UI.tmp.reroll, idx,
    ammoWeapons: c && c.attack && c.attack.weapons ? c.attack.weapons.filter(x => x.w.ammoKey).map(x => x.w.name) : [], ammoKeys: c && c.attack && c.attack.weapons ? c.attack.weapons.filter(x => x.w.ammoKey).map(x => x.w.ammoKey) : [] };
  UI.render();
}
function runReco(idx = 0, pickId = null) {
  const s = S(); if (!s) return;
  const r = SoloAssistant.recommend(s, UI.tmp.actingId, { reroll: UI.tmp.reroll });
  if (!r.ok) { UI.tmp.result = { sessionId: s.id, actingId: UI.tmp.actingId, ok: false, errors: r.errors, missing: r.ctx ? r.ctx.missing : [] }; UI.render(); return; }
  if (pickId != null) { const i = r.ranked.findIndex(c => c.id === pickId); idx = i < 0 ? 0 : i; }
  idx = ((idx % r.ranked.length) + r.ranked.length) % r.ranked.length;
  r.reco = RecommendationExplainer.explain(r.ranked, r.ctx, idx);
  storeResult(s, r, idx);
}
function nextActing(s) { const ops = s.units.filter(u => u.side === 'enemy' && BattleState.operational(u)); const n = ops.find(u => u.actedTurn !== s.turn); return n ? n.id : (ops[0] || {}).id || null; }

const Actions = {
  goto: el => UI.goto(el.dataset.view),
  saveNow: () => Disk.saveNow(),
  toggleTheme: () => { const s = Store.state.settings; s.theme = s.theme === 'light' ? 'dark' : 'light'; Store.commit(); },
  closeDialog: () => UI.closeDialog(),
  diskLink: () => Disk.link(), diskReconnect: () => Disk.reconnect(), diskDownload: () => Disk.downloadBackup(), diskOpen: () => Disk.openFile(),
  diskUnlink: async () => { if (await UI.confirm('Unlink the save file? The file itself is not deleted; changes will no longer be written to it.', { okLabel: 'Unlink' })) Disk.unlink(); },

  /* ---- forces ---- */
  openForce: el => { const f = Store.force(el.dataset.force); if (!f) return; Store.state.ui[f.ruleset + (f.role === 'enemy' ? 'Enemy' : 'Friendly')] = f.id; Store.persistLocal(); UI.goto(f.ruleset); },
  builderTab: el => { UI.tmp.builderTab[el.dataset.rs] = el.dataset.tab; UI.render(); },
  toggleCompact: el => { UI.tmp.compact[el.dataset.rs] = !UI.tmp.compact[el.dataset.rs]; UI.render(); },
  newForce: el => {
    const rs = el.dataset.rs, side = el.dataset.side; const f = Forces.newForce(rs, side);
    const L = Store.state.settings.limits[rs]; f.limits = Object.assign({ pv: null, units: null, tonnage: null }, U.clone(L));
    Store.state.forces.push(f); Store.state.ui[rs + (side === 'enemy' ? 'Enemy' : 'Friendly')] = f.id; UI.tmp.builderTab[rs] = side; Store.commit(); UI.toast(`Created “${f.name}”. Add units from the library.`);
  },
  addToForce: el => {
    const st = Store.state; const rs = el.dataset.rs, side = el.dataset.side; const key = rs + (side === 'enemy' ? 'Enemy' : 'Friendly');
    let f = Store.force(st.ui[key]);
    if (!f) { f = Forces.newForce(rs, side); f.limits = Object.assign({ pv: null, units: null, tonnage: null }, U.clone(st.settings.limits[rs])); st.forces.push(f); st.ui[key] = f.id; }
    const u = Store.unit(el.dataset.unit); if (!Units.hasProfile(u, rs)) { UI.toast(`${Units.label(u)} has no ${RULESETS[rs].name} data.`, 'bad'); return; }
    const e = Forces.newEntry(u.id); if (rs === 'classic') { e.gunnery = u.classic.gunnery ?? 4; e.piloting = u.classic.piloting ?? 5; } else e.skill = u.alphaStrike.skill ?? 4;
    f.entries.push(e); f.updatedAt = U.now(); Store.commit(); UI.toast(`${Units.label(u)} → ${f.name}`);
  },
  cloneForce: el => { const f = Store.force(el.dataset.force); const c = Forces.cloneForce(f); Store.state.forces.push(c); Store.state.ui[f.ruleset + (f.role === 'enemy' ? 'Enemy' : 'Friendly')] = c.id; Store.commit(); UI.toast('Force cloned.'); },
  exportForce: el => { const f = Store.force(el.dataset.force); U.download(`mechops-force-${U.slug(f.name)}.json`, JSON.stringify(Forces.exportBundle(f, Store.state.units), null, 2)); UI.toast('Force exported. Follow your sharing guidelines for exported files.'); },
  importForce: () => UI.pickFile('.json,application/json', startImport),
  deleteForce: async el => {
    const f = Store.force(el.dataset.force); if (!(await UI.confirm(`Delete force “${f.name}”? Battles already started keep their own copy of the units.`, { okLabel: 'Delete force' }))) return;
    const st = Store.state; st.forces = st.forces.filter(x => x.id !== f.id); ['as', 'classic'].forEach(rs => ['Friendly', 'Enemy'].forEach(k => { if (st.ui[rs + k] === f.id) st.ui[rs + k] = null; })); Store.commit(); UI.toast('Force deleted.');
  },
  entryQty: el => { const [f, e] = forceEntry(el.dataset.force, el.dataset.entry); e.qty = Math.max(1, (e.qty || 1) + Number(el.dataset.d)); f.updatedAt = U.now(); Store.commit(); },
  entryDup: el => { const [f, e] = forceEntry(el.dataset.force, el.dataset.entry); const c = U.clone(e); c.id = U.uid('fe'); f.entries.splice(f.entries.indexOf(e) + 1, 0, c); Store.commit(); },
  entryRemove: el => { const [f, e] = forceEntry(el.dataset.force, el.dataset.entry); f.entries = f.entries.filter(x => x !== e); Store.commit(); },
  explainSpecial: el => { const k = el.dataset.key + '|' + el.dataset.code; UI.tmp.explain = UI.tmp.explain === k ? null : k; if (document.getElementById('dlg').open && UI.dlgRender) UI.refreshDialog(); else UI.render(); },

  /* ---- units ---- */
  viewUnit: el => { const u = Store.unit(el.dataset.unit); if (u) UI.openDialog(() => unitViewDialog(u, el.dataset.rs || null)); },
  newUnit: el => { const u = Units.blank(); const rs = el.dataset.rs; if (!rs || rs === 'as') u.alphaStrike = Units.blankAS(); if (!rs || rs === 'classic') u.classic = Units.blankClassic(); UI.tmp.edit = { unit: u, isNew: true, errors: [], warnings: [], stash: {} }; UI.openDialog(unitEditorDialog); },
  editUnit: el => { const u = Store.unit(el.dataset.unit); UI.tmp.edit = { unit: U.clone(u), isNew: false, errors: [], warnings: Schema.validateUnit(u).warnings, stash: {} }; UI.openDialog(unitEditorDialog); },
  dupUnit: el => { const u = U.clone(Store.unit(el.dataset.unit)); u.id = U.uid('unit'); u.name += ' (copy)'; u.createdAt = u.updatedAt = U.now(); Store.state.units.push(u); Store.commit(); UI.toast('Unit duplicated.'); },
  deleteUnit: async el => {
    const u = Store.unit(el.dataset.unit); const used = Units.usedBy(u.id);
    if (!(await UI.confirm(`Delete ${Units.label(u)}?${used.length ? ` It will also be removed from ${used.length} force(s): ${used.map(f => f.name).join(', ')}.` : ''} Battles in progress keep their own copy.`, { okLabel: 'Delete unit' }))) return;
    const st = Store.state; st.units = st.units.filter(x => x.id !== u.id); used.forEach(f => { f.entries = f.entries.filter(e => e.unitId !== u.id); }); Store.commit(); UI.toast('Unit deleted.');
  },
  importUnits: () => UI.pickFile('.json,application/json', startImport),
  exportUnits: el => { const list = el.dataset.filtered ? unitsFiltered() : Store.state.units; U.download(`mechops-units-${list.length}.json`, JSON.stringify({ type: 'mechops-units', schemaVersion: APP.schemaVersion, app: APP.name, exportedAt: U.now(), units: list }, null, 2)); },
  exportForces: () => { const st = Store.state; const ids = new Set(st.forces.flatMap(f => f.entries.map(e => e.unitId))); U.download('mechops-forces.json', JSON.stringify({ type: 'mechops-forces', schemaVersion: APP.schemaVersion, app: APP.name, exportedAt: U.now(), forces: st.forces, units: st.units.filter(u => ids.has(u.id)) }, null, 2)); },
  ueAddRow: el => { const c = UI.tmp.edit.unit.classic; if (el.dataset.coll === 'weapons') c.weapons.push({ id: U.uid('w'), name: 'New weapon', loc: 'RA', heat: 0, damage: 0, min: 0, short: 1, medium: 2, long: 3, cluster: false, ammoKey: null, rear: false }); else (c.ammo = c.ammo || []).push({ key: '', name: '', loc: 'LT', shots: 0 }); UI.refreshDialog(); },
  ueDelRow: el => { const c = UI.tmp.edit.unit.classic; c[el.dataset.coll].splice(Number(el.dataset.i), 1); UI.refreshDialog(); },
  ueApplyJson: () => { try { const o = JSON.parse(document.getElementById('ue-json').value); if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('Expected one unit object.'); if (!o.id) o.id = UI.tmp.edit.unit.id; UI.tmp.edit.unit = o; const v = Schema.validateUnit(o); UI.tmp.edit.errors = v.errors; UI.tmp.edit.warnings = v.warnings; UI.refreshDialog(); } catch (e) { UI.toast('JSON error: ' + e.message, 'bad'); } },
  ueSave: () => {
    const ed = UI.tmp.edit; const u = ed.unit; const v = Schema.validateUnit(u); ed.errors = v.errors; ed.warnings = v.warnings;
    if (v.errors.length) { UI.refreshDialog(); const b = document.querySelector('#dlg .dlg-bd'); if (b) b.scrollTop = 0; return; }
    u.updatedAt = U.now(); const st = Store.state; const i = st.units.findIndex(x => x.id === u.id);
    if (i >= 0) st.units[i] = u; else st.units.push(u);
    UI.closeDialog(); Store.commit(); UI.toast(`Saved ${Units.label(u)}.${v.warnings.length ? ' (with warnings)' : ''}`, 'ok');
  },

  /* ---- battle setup ---- */
  newBattle: el => { UI.tmp.nb = null; const nb = nbState(); const rs = el.dataset.rs; if (rs) { nb.ruleset = rs; nb.friendlyForceId = Store.state.ui[rs + 'Friendly'] || ''; nb.enemyForceId = Store.state.ui[rs + 'Enemy'] || ''; const p = MAP_PRESETS[rs][1]; Object.assign(nb, { preset: p.id, width: p.width, height: p.height }); } Store.state.ui.activeSessionId = null; UI.goto('battle'); },
  nbRuleset: el => { const nb = nbState(); const rs = el.dataset.rs; const st = Store.state; const p = MAP_PRESETS[rs][1]; Object.assign(nb, { ruleset: rs, friendlyForceId: st.ui[rs + 'Friendly'] || '', enemyForceId: st.ui[rs + 'Enemy'] || '', preset: p.id, width: p.width, height: p.height }); UI.render(); },
  startBattle: () => {
    const nb = nbState(); const st = Store.state;
    if (!nb.friendlyForceId || !nb.enemyForceId) { UI.toast('Choose both a friendly and an enemy force.', 'bad'); return; }
    const obj = (nb.objX !== '' && nb.objY !== '' && isNum(Number(nb.objX)) && isNum(Number(nb.objY))) ? { x: Number(nb.objX), y: Number(nb.objY) } : null;
    const s = BattleState.create({ ruleset: nb.ruleset, name: nb.name, friendlyForceId: nb.friendlyForceId, enemyForceId: nb.enemyForceId, map: { width: U.clamp(U.num(nb.width, 36), 4, 144), height: U.clamp(U.num(nb.height, 24), 4, 144), unit: RULESETS[nb.ruleset].unit, preset: nb.preset }, scenario: { type: nb.scenario, description: nb.description, objective: obj }, options: { optionalRules: nb.optional.slice() }, deploy: nb.deploy, ai: { personality: nb.personality, risk: 0.5, priorities: { damage: 1, survival: 1, position: 1, objective: 1 } } }, st);
    if (!s.units.some(u => u.side === 'friendly') || !s.units.some(u => u.side === 'enemy')) { UI.toast('Both sides need at least one unit with data for this ruleset.', 'bad'); return; }
    st.sessions.push(s); st.ui.activeSessionId = s.id; UI.tmp.nb = null; UI.tmp.result = null; UI.tmp.selectedUS = null; UI.tmp.battleTab = 'map'; Store.commit(); UI.toast('Battle started — it saves automatically.', 'ok');
  },
  quickBattle: el => {
    const rs = el.dataset.rs; const st = Store.state; const fs = st.forces.filter(f => f.ruleset === rs);
    const f = Store.force(st.ui[rs + 'Friendly']) || fs.find(x => x.role === 'friendly') || fs[0]; const e = Store.force(st.ui[rs + 'Enemy']) || fs.find(x => x.role === 'enemy' && x !== f) || fs.find(x => x !== f);
    if (!f || !e) { UI.toast(`Create a friendly and an enemy ${RULESETS[rs].name} force first.`, 'bad'); UI.goto(rs); return; }
    const p = MAP_PRESETS[rs][1];
    const s = BattleState.create({ ruleset: rs, name: `Quick ${RULESETS[rs].short} battle ${new Date().toLocaleDateString()}`, friendlyForceId: f.id, enemyForceId: e.id, map: { width: p.width, height: p.height, unit: p.unit, preset: p.id }, deploy: 'auto' }, st);
    st.sessions.push(s); st.ui.activeSessionId = s.id; st.ui.view = 'battle'; UI.tmp.result = null; UI.tmp.selectedUS = null; UI.tmp.battleTab = 'map'; Store.commit(); window.scrollTo(0, 0);
  },
  resumeSession: el => { Store.state.ui.activeSessionId = el.dataset.id; UI.tmp.result = null; UI.tmp.selectedUS = null; UI.tmp.actingId = null; UI.goto('battle'); },
  closeSession: () => { Store.state.ui.activeSessionId = null; UI.tmp.result = null; Store.commit(); UI.toast('Battle saved and closed. Resume it any time from the dashboard.'); },
  endSession: () => { const s = S(); s.status = 'ended'; TurnLog.add(s, { side: 'system', type: 'session', text: 'Battle ended.' }); Store.commit(); },
  reopenSession: () => { const s = S(); s.status = 'active'; TurnLog.add(s, { side: 'system', type: 'session', text: 'Battle reopened.' }); Store.commit(); },
  deleteSession: async el => { const st = Store.state; const s = Store.session(el.dataset.id); if (!(await UI.confirm(`Delete battle “${s.name}” and its log? This cannot be undone.`, { okLabel: 'Delete battle' }))) return; st.sessions = st.sessions.filter(x => x.id !== s.id); if (st.ui.activeSessionId === s.id) st.ui.activeSessionId = null; Store.commit(); },

  /* ---- battle play ---- */
  nextPhase: () => { const s = S(); BattleState.nextPhase(s); Store.commit(); },
  activeSide: el => { const s = S(); s.activeSide = el.dataset.side; TurnLog.add(s, { side: 'system', type: 'side', text: `Active side: ${el.dataset.side}.` }); if (el.dataset.side === 'enemy') UI.tmp.actingId = nextActing(s); Store.commit(); },
  battleTab: el => { UI.tmp.battleTab = el.dataset.tab; UI.render(); },
  selectUS: el => { const s = S(); const u = BattleState.getUnit(s, el.dataset.us); UI.tmp.selectedUS = u.id; if (u.side === 'enemy' && BattleState.operational(u)) UI.tmp.actingId = u.id; UI.render(); },
  mapClick: (el, ev) => {
    const s = S(); const svg = el.closest('svg'); const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = U.clamp(Math.round(p.x * 2) / 2, 0, s.map.width), y = U.clamp(Math.round(p.y * 2) / 2, 0, s.map.height);
    placeAt(s, x, y);
  },
  hexClick: el => { const s = S(); placeAt(s, Number(el.dataset.x), Number(el.dataset.y)); },
  placeObjective: () => { UI.tmp.placeObjective = !UI.tmp.placeObjective; UI.render(); },
  autoDeploy: async () => { const s = S(); if (s.units.some(BattleState.placed) && !(await UI.confirm('Reposition all units along the long table edges?', { okLabel: 'Auto-deploy', danger: false }))) return; BattleState.autoDeploy(s); touch(s); Store.commit(); },
  usFacing: el => { const u = usOf(el.dataset.us); u.facing = (u.facing + Number(el.dataset.d) + 6) % 6; touch(S()); Store.commit(); },
  usUnplace: el => { const u = usOf(el.dataset.us); u.pos = { x: null, y: null }; touch(S()); Store.commit(); },
  asPip: el => { const u = usOf(el.dataset.us); const a = u.snapshot.alphaStrike; const st = el.dataset.kind === 'st'; const max = st ? a.structure : a.armor; const left = st ? u.as.structLeft : u.as.armorLeft; const i = Number(el.dataset.i); const cur = max - left; const nd = cur === i + 1 ? i : i + 1; if (st) u.as.structLeft = max - nd; else u.as.armorLeft = max - nd; touch(S()); Store.commit(); },
  asHeat: el => { const u = usOf(el.dataset.us); u.as.heat = Number(el.dataset.h); if (u.as.heat >= 4) UI.toast('Heat at shutdown level — set the status manually if your rules shut the unit down.'); touch(S()); Store.commit(); },
  asCrit: el => { const u = usOf(el.dataset.us); const k = el.dataset.k; u.as.crits[k] = Math.max(0, u.as.crits[k] + Number(el.dataset.d)); touch(S()); Store.commit(); },
  cbtLoc: el => { const u = usOf(el.dataset.us); const l = el.dataset.loc, kind = el.dataset.kind; const max = u.snapshot.classic[kind][l]; u.cbt[kind][l] = U.clamp((u.cbt[kind][l] ?? max) + Number(el.dataset.d), 0, max); touch(S()); Store.commit(); },
  cbtAmmo: el => { const u = usOf(el.dataset.us); const i = Number(el.dataset.i); u.cbt.ammo[i] = U.clamp(u.cbt.ammo[i] + Number(el.dataset.d), 0, u.snapshot.classic.ammo[i].shots); touch(S()); Store.commit(); },
  cbtHeat: el => { const u = usOf(el.dataset.us); u.cbt.heat = Math.max(0, u.cbt.heat + Number(el.dataset.d)); touch(S()); Store.commit(); },
  cbtDissipate: el => { const s = S(); const u = usOf(el.dataset.us); const d = Units.dissipation(u.snapshot.classic); const before = u.cbt.heat; u.cbt.heat = Math.max(0, before - d); TurnLog.add(s, { side: u.side, type: 'heat', unitId: u.id, text: `${u.label} heat phase: ${before} − ${d} dissipation → ${u.cbt.heat} (calculated).` }); Store.commit(); },
  cbtPilot: el => { const u = usOf(el.dataset.us); const h = Number(el.dataset.h); u.cbt.pilotHits = u.cbt.pilotHits === h ? h - 1 : h; touch(S()); Store.commit(); },
  recommend: () => { UI.tmp.reroll = 0; runReco(0); },
  nextReco: () => runReco((UI.tmp.result ? UI.tmp.result.idx : 0) + 1),
  rerollReco: () => { UI.tmp.reroll++; runReco(0); },
  useAlt: el => runReco(0, Number(el.dataset.cid)),
  acceptReco: () => {
    const s = S(); const res = UI.tmp.result; if (!res || !res.ok) return; const u = BattleState.getUnit(s, res.actingId); const r = res.reco;
    const extra = [];
    const heatEl = document.getElementById('ac-heat'), moveEl = document.getElementById('ac-move'), ammoEl = document.getElementById('ac-ammo');
    if (heatEl && heatEl.checked && r.heatInfo) { const g = r.heatInfo.gen || 0; if (u.as) u.as.heat = Math.min(4, u.as.heat + g); else u.cbt.heat += g; extra.push(`heat +${g} recorded`); }
    if (moveEl && moveEl.checked) { const map = u.as ? { hold: 'stand', ground: 'ground', jump: 'jump' } : { hold: 'stand', walk: 'walk', run: 'run', jump: 'jump' }; u.moveStatus = map[r.mode] || r.mode; }
    if (ammoEl && ammoEl.checked && u.cbt) { res.ammoKeys.forEach(k => { const bins = u.snapshot.classic.ammo; const i = bins.findIndex((b, j) => b.key === k && u.cbt.ammo[j] > 0); if (i >= 0) u.cbt.ammo[i]--; }); extra.push('ammo deducted'); }
    u.actedTurn = s.turn;
    TurnLog.add(s, { side: 'enemy', type: 'ai-accepted', unitId: u.id, text: `${u.label} ${u.name}: ${r.headline}${extra.length ? ` [${extra.join(', ')}]` : ''}`, details: { option: res.idx + 1, reroll: res.reroll, personality: s.ai.personality, score: U.round(r.score, 3) } });
    UI.tmp.result = null; UI.tmp.actingId = nextActing(s); Store.commit(); UI.toast('Enemy action logged. Move the miniature and resolve rolls at the table.', 'ok');
  },
  overrideReco: () => {
    const s = S(); const res = UI.tmp.result; const txt = (document.getElementById('ovr-text') || {}).value || ''; if (!txt.trim()) { UI.toast('Describe the action you chose instead.', 'bad'); return; }
    const u = BattleState.getUnit(s, res.actingId); u.actedTurn = s.turn;
    TurnLog.add(s, { side: 'enemy', type: 'override', unitId: u.id, text: `${u.label} ${u.name}: OVERRIDE → ${txt.trim()} (assistant suggested: ${res.reco ? res.reco.headline : '—'})` });
    UI.tmp.result = null; UI.tmp.actingId = nextActing(s); Store.commit(); UI.toast('Override logged.', 'ok');
  },
  roll: el => {
    const n = Number(el.dataset.n); const dice = Prob.roll(n); const total = U.sum(dice); const d = UI.tmp.dice; d.last = { dice, total, n };
    const s = S(); if (d.log && s) { TurnLog.add(s, { side: s.activeSide, type: 'dice', text: `Rolled ${n}D6: ${dice.join(' + ')} = ${total}${n === 2 ? ` (TN ${d.tn}: ${total >= d.tn ? 'success' : 'fail'})` : ''}` }); Store.commit(); } else UI.render();
  },
  addLog: () => { const s = S(); const el = document.getElementById('lognote'); const txt = el.value.trim(); if (!txt) return; TurnLog.add(s, { side: document.getElementById('lognote-side').value, type: 'note', text: txt }); Store.commit(); },

  /* ---- reference ---- */

function placeAt(s, x, y) {
  if (UI.tmp.placeObjective) { s.scenario.objective = { x, y }; UI.tmp.placeObjective = false; TurnLog.add(s, { side: 'system', type: 'setup', text: `Objective set at (${x}, ${y}).` }); touch(s); Store.commit(); return; }

  ueEquip: el => { UI.tmp.edit.unit.classic.equipment = el.value.split(',').map(x => x.trim()).filter(Boolean); },
  ueCrit: el => { const c = UI.tmp.edit.unit.classic; c.crits = c.crits || {}; c.crits[el.dataset.loc] = el.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean); },
