  },
  _deb: null,
  onChange() {
    if (!this.handle || this.needsPermission || !Store.state.settings.autosaveDisk) return;
    if (!this._deb) this._deb = U.debounce(() => this.write(), 800);
    this._deb();
  },
  async saveNow() {
    if (this.handle) { if (this.needsPermission) return this.reconnect(); const ok = await this.write(); UI.toast(ok ? `Saved to ${this.handle.name}` : 'Disk save failed: ' + this.error, ok ? 'ok' : 'bad'); return; }
    if (this.supported()) return this.link();
    this.downloadBackup();
  },
  downloadBackup() {
    const d = new Date(); const stamp = d.toISOString().slice(0, 16).replace(/[:T]/g, '-');
    U.download(`mechops-solo-backup-${stamp}.json`, Store.serialize()); this.lastDownload = U.now(); Store.dirtyDisk = false;
    UI.toast('Backup downloaded. Keep it with your other game files — respect your internal data classification rules when sharing.', 'ok'); UI.renderStatus();
  },
  /** Open a save file from disk (replaces current data after confirmation). */
  async openFile() {
    if (this.supported()) {
      try {
        const [h] = await window.showOpenFilePicker({ types: this.pickerTypes, multiple: false });
        const text = await (await h.getFile()).text();
        const ok = await UI.loadBackupText(text, h.name);
        if (ok) { this.handle = h; this.needsPermission = false; try { await IDB.set('saveHandle', h); } catch (e) { } const p = await h.queryPermission({ mode: 'readwrite' }); this.needsPermission = p !== 'granted'; this.lastSaved = U.now(); Store.dirtyDisk = false; UI.render(); }
      } catch (e) { if (e.name !== 'AbortError') UI.toast('Could not open file: ' + e.message, 'bad'); }
    } else UI.pickFile('.json,application/json', async (text, name) => { await UI.loadBackupText(text, name); });
  },
  status() {
    if (this.saving) return { cls: 'pending', text: 'Saving…' };
    if (this.handle) {
      if (this.needsPermission) return { cls: 'pending', text: 'Reconnect save file' };
      if (this.error) return { cls: 'err', text: 'Disk save failed' };
      if (Store.dirtyDisk) return { cls: 'pending', text: Store.state.settings.autosaveDisk ? 'Saving…' : 'Unsaved changes' };
      return { cls: 'ok', text: `Saved ${this.lastSaved ? new Date(this.lastSaved).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''} · ${this.handle.name}` };
    }
    if (!Store.localOk) return { cls: 'err', text: 'Not saved — download a backup' };
    return { cls: 'local', text: Store.dirtyDisk ? 'Browser only · save to disk' : 'Browser storage' };
  },
};
</script>
<script>
'use strict';
/* =====================================================================
   Solo enemy assistant — deterministic, transparent, testable.
   Tactical heuristics are NOT BattleTech rules; rules resolution stays
   with the player. Every heuristic factor lives in settings.ai.
   ===================================================================== */

/* ------------------------------------------- RulesAdapterAlphaStrike ---- */
const RulesAdapterAlphaStrike = {
  id: 'as', unit: '"', unitWord: 'inches',
  fmt(d) { return `${U.round(d, 1)}"`; },
  profileOk(us) { return !!(us.snapshot && us.snapshot.alphaStrike); },
  bands(st) { return st.settings.rulesParams.as.bands; },
  band(dist, st) { const b = this.bands(st); if (dist <= b.short) return 's'; if (dist <= b.medium) return 'm'; if (dist <= b.long) return 'l'; return 'e'; },
  bandName(k) { return ({ s: 'Short', m: 'Medium', l: 'Long', e: 'Extreme' })[k] || k; },
  /** damage value at band after recorded weapon critical hits (calc, default parameter) */
  dmgAt(us, band, st) {
    const a = us.snapshot.alphaStrike; const raw = a.damage[band];
    if (raw == null) return 0;
    let v = Units.asDamage(raw, st.settings);
    const hits = (us.as && us.as.crits.weapons) || 0;
    if (hits) v = Math.max(0, v - hits * st.settings.rulesParams.as.weaponHitPenalty);
    return v;
  },
  moves(us, st) {
    const m = Units.asMoves(us.snapshot.alphaStrike); let g = m.ground, j = m.jump; const mp = (us.as && us.as.crits.mp) || 0;
    if (mp && st.settings.rulesParams.as.mpHitHalves) { g = Math.floor(g / 2 ** mp); j = Math.floor(j / 2 ** mp); }
    const out = [{ mode: 'ground', mv: g, heat: 0, acc: 0.92 }];
    if (j > 0) out.push({ mode: 'jump', mv: j, heat: 0, acc: 0.85 });
    return out.filter(o => o.mv > 0);
  },
  modeText(mode, moved) { return mode === 'jump' ? `jump ${U.round(moved, 0)}"` : mode === 'hold' ? 'stand still' : `move ${U.round(moved, 0)}"`; },
  attack(us, target, dist, opts, st) {
    const band = this.band(dist, st); const a = us.snapshot.alphaStrike;
    let raw = this.dmgAt(us, band, st); let ovUsed = 0;
    if (raw > 0 && opts.overheat && a.ov > 0 && (band === 's' || band === 'm' || (band === 'l' && (a.specials || []).includes('OVL')))) { ovUsed = a.ov; raw += a.ov; }
    const expected = raw * st.settings.ai.bandFactor[band] * (opts.acc ?? 1);
    return { inRange: raw > 0, band, bandText: this.bandName(band), raw: U.round(raw, 1), expected, heat: ovUsed, ovUsed, text: raw > 0 ? `attack ${target.name} — ${U.round(raw, 1)} damage on a hit at ${this.bandName(band)} range${ovUsed ? ` (incl. OV ${ovUsed})` : ''}` : `no damage at ${this.bandName(band)} range` };
  },
  /** estimated incoming damage potential of `us` at a distance (heuristic) */
  threatAt(us, dist, st) { const band = this.band(dist, st); return this.dmgAt(us, band, st) * st.settings.ai.bandFactor[band]; },
  preferredDistance(us, st) {
    const b = this.bands(st); const mids = { s: b.short / 2, m: (b.short + b.medium) / 2, l: (b.medium + b.long) / 2 };
    let best = 's', bv = -1; ['s', 'm', 'l'].forEach(k => { const v = this.dmgAt(us, k, st); if (v >= bv) { bv = v; best = k; } });
    return { dist: mids[best], band: best, value: bv };
  },
  positionScore(us, dist, st) { const p = this.preferredDistance(us, st); if (p.value <= 0) return 0; return this.dmgAt(us, this.band(dist, st), st) / p.value; },
  physicalEstimate(us) { const a = us.snapshot.alphaStrike; return (a.size || 1) + ((a.specials || []).some(s => s.startsWith('MEL')) ? 1 : 0); },
  heatProjection(us, cand, st) { const cur = us.as ? us.as.heat : 0; const gen = cand.attack ? cand.attack.heat : 0; const proj = cur + gen; const budget = Math.min(3, Math.round(cand.heatBudget / 2)); return { cur, gen, proj, budget, over: gen > 0 ? Math.max(0, proj - budget) : 0, shutdownRisk: gen > 0 && proj >= 4 }; },
  ruleChecks(c, ctx) {
    const us = ctx.acting, out = [];
    if (c.attack && c.attack.inRange) {
      out.push(`Attack roll: 2D6 against a target number built from Skill ${us.skill} plus modifiers (range: ${c.attack.bandText}, attacker movement, target movement/TMM, terrain, heat, crits). Resolve with your rulebook.`);
      out.push(`If the attack hits: apply ${c.attack.raw} damage to ${c.target.name} — armor first, then structure — and check critical hits where required.`);
    }
    if (c.attack && c.attack.ovUsed) out.push(`Overheat: record +${c.attack.ovUsed} heat on ${us.name} and apply heat effects per your rulebook.`);
    if (c.mode === 'jump') out.push('Jump movement: check jump rules, terrain and the attack modifier for jumping.');
    if (c.inCover) out.push('Confirm the cover / terrain at the destination and its effect on attacks against this unit.');
    if (c.intent === 'physical') out.push('Physical attack: check eligibility and damage in your rulebook (the damage shown is only an estimate).');
    const cr = us.as.crits; const hits = Object.entries(cr).filter(([, v]) => v > 0).map(([k, v]) => `${k.toUpperCase()}×${v}`);
    if (hits.length) out.push(`Recorded critical hits (${hits.join(', ')}): apply their effects to movement, accuracy and damage per your rulebook.`);
    if (us.as.heat > 0) out.push(`Current heat ${us.as.heat}: apply heat effects to movement and accuracy (not applied automatically).`);
    return out;
  },
  unsupported: ['To-hit target number calculation', 'TMM derivation from movement', 'Terrain movement costs and terrain modifiers', 'Indirect fire procedure (IF is displayed, not simulated)', 'Special-ability effects (shown as reference only)', 'Critical hit resolution', 'Facing and other optional rules', 'Heat effects on movement / accuracy'],
};

/* ----------------------------------------------- RulesAdapterClassic ---- */
const RulesAdapterClassic = {
  id: 'classic', unit: ' hex', unitWord: 'hexes',
  fmt(d) { const n = Math.round(d); return `${n} hex${n === 1 ? '' : 'es'}`; },
  profileOk(us) { return !!(us.snapshot && us.snapshot.classic); },
  locDestroyed(us, loc) { return us.cbt && us.cbt.internal[loc] != null && us.cbt.internal[loc] <= 0; },
  ammoFor(us, key) { const c = us.snapshot.classic; let n = 0; (c.ammo || []).forEach((a, i) => { if (a.key === key && !this.locDestroyed(us, a.loc)) n += Math.max(0, us.cbt.ammo[i] ?? a.shots); }); return n; },
  availableWeapons(us) {
    const c = us.snapshot.classic;
    return (c.weapons || []).filter(w => !us.cbt.destroyedWeapons[w.id] && !this.locDestroyed(us, w.loc) && (!w.ammoKey || this.ammoFor(us, w.ammoKey) > 0));
  },
  bracket(w, dist) { if (dist > w.long) return null; if (dist <= w.short) return 'short'; if (dist <= w.medium) return 'medium'; return 'long'; },
  weaponExpected(w, dist, st) {
    const br = this.bracket(w, dist); if (!br) return null;
    const ai = st.settings.ai; let f = ai.rangeFactor[br]; const belowMin = w.min > 0 && dist <= w.min; if (belowMin) f *= 0.6; if (w.cluster) f *= ai.clusterFactor;
    return { w, bracket: br, belowMin, exp: w.damage * f };
  },
  dissipation(us) { return Units.dissipation(us.snapshot.classic); },
  moves(us, st) {
    const c = us.snapshot.classic; const mh = st.settings.rulesParams.classic.moveHeat; const out = [];
    if (c.walk > 0) out.push({ mode: 'walk', mv: c.walk, heat: mh.walk, acc: 0.9 });
    const run = Units.classicRun(c); if (run > 0) out.push({ mode: 'run', mv: run, heat: mh.run, acc: 0.8 });
    if (c.jump > 0) out.push({ mode: 'jump', mv: c.jump, heat: null, acc: 0.7 });
    return out;
  },
  moveHeat(mode, moved, st) { const mh = st.settings.rulesParams.classic.moveHeat; if (mode === 'hold') return mh.stand; if (mode === 'jump') return Math.max(mh.jumpMin, Math.ceil(moved)); return mh[mode] ?? 0; },
  modeText(mode, moved) { return mode === 'hold' ? 'stand still' : `${mode} ${Math.round(moved)} hex${Math.round(moved) === 1 ? '' : 'es'}`; },
  /** Choose a fire group under the heat allowance (greedy, transparent). */
  attack(us, target, dist, opts, st) {
    dist = Math.max(1, Math.round(dist));
    const cand = this.availableWeapons(us).map(w => this.weaponExpected(w, dist, st)).filter(Boolean);
    const diss = this.dissipation(us); const cur = us.cbt.heat; const mvHeat = opts.moveHeat || 0;
    let allowance = diss == null ? Infinity : opts.heatBudget - (cur + mvHeat - diss);
    if (opts.holdFire) allowance = 0;
    const sorted = cand.slice().sort((a, b) => (a.w.heat === 0 ? -1 : 0) - (b.w.heat === 0 ? -1 : 0) || (b.exp / Math.max(1, b.w.heat)) - (a.exp / Math.max(1, a.w.heat)));
    const chosen = []; let heat = 0;
    sorted.forEach(x => { if (heat + x.w.heat <= Math.max(0, allowance)) { chosen.push(x); heat += x.w.heat; } });
    const raw = U.sum(chosen.map(x => x.w.damage)); const expected = U.sum(chosen.map(x => x.exp)) * (opts.acc ?? 1);
    const names = chosen.map(x => `${x.w.name} (${x.bracket[0].toUpperCase()}${x.belowMin ? ', min-range' : ''})`);
    const brs = [...new Set(chosen.map(x => x.bracket))];
    return { inRange: chosen.length > 0, raw, expected, heat, weapons: chosen, available: cand.length, bandText: brs.join('/') || 'out of range', belowMin: chosen.some(x => x.belowMin),
      text: chosen.length ? `fire ${names.join(', ')} at ${target.name} — up to ${raw} damage if all hit, +${heat} weapon heat` : (opts.holdFire ? 'hold fire to shed heat' : (cand.length ? 'hold fire (heat budget exhausted)' : `no weapon in range of ${target.name}`)) };
  },
  threatAt(us, dist, st) { if (!us.cbt) return 0; dist = Math.max(1, Math.round(dist)); return U.sum(this.availableWeapons(us).map(w => this.weaponExpected(w, dist, st)).filter(Boolean).map(x => x.exp)); },
  preferredDistance(us, st) {
    const ws = this.availableWeapons(us); const maxR = Math.max(1, ...ws.map(w => w.long)); let best = 1, bv = -1;
    for (let d = 1; d <= maxR; d++) { const v = this.threatAt(us, d, st); if (v >= bv - 1e-9) { bv = v; best = d; } }
    return { dist: best, band: `${best} hex`, value: bv };
  },
  positionScore(us, dist, st) { const p = this.preferredDistance(us, st); if (p.value <= 0) return 0; return this.threatAt(us, dist, st) / p.value; },
  physicalEstimate(us) { const t = us.snapshot.classic.tonnage || us.snapshot.tonnage || 50; return Math.round(t / 5); },
  heatProjection(us, cand, st) {
    const diss = this.dissipation(us); const cur = us.cbt.heat; const gen = (cand.moveHeat || 0) + (cand.attack ? cand.attack.heat : 0);
    const proj = diss == null ? null : Math.max(0, cur + gen - diss);
    return { cur, gen, diss, proj, budget: cand.heatBudget, over: proj == null ? 0 : Math.max(0, proj - cand.heatBudget) };
  },
  ruleChecks(c, ctx, st) {
    const us = ctx.acting, out = [];
    if (c.attack && c.attack.inRange) {
      out.push(`To-hit for each weapon: 2D6 against Gunnery ${us.gunnery} + range modifier (${c.attack.bandText}) + attacker movement (${c.mode}) + target movement + terrain + heat / damage modifiers. Resolve with your rulebook.`);
      out.push('For each hit: roll hit location (and cluster hits for missile weapons) using your rulebook tables; apply damage in the trackers.');
      const ammoW = c.attack.weapons.filter(x => x.w.ammoKey); if (ammoW.length) out.push(`Ammunition: deduct one shot for ${ammoW.map(x => x.w.name).join(', ')} in the tracker.`);
      if (c.attack.belowMin) out.push('A selected weapon is at or inside its minimum range — apply the minimum-range modifier.');
    }
    const hp = c.heat; if (hp && hp.proj != null) out.push(`Heat phase (calculated): generated ${hp.gen} (movement ${c.moveHeat}, weapons ${c.attack ? c.attack.heat : 0}), dissipation ${hp.diss} → projected heat ${hp.proj}. Check your heat scale for effects.`);
    if (c.mode === 'run' || c.mode === 'jump') out.push('Check whether this movement requires a Piloting Skill Roll (terrain, damaged legs/gyro, etc.).');
    if (c.mode === 'hold' && c.arcNote) out.push(c.arcNote);
    if (c.flank) out.push('Flanking: confirm the destination hex actually reaches the target\'s side or rear arc before applying rear-armor hits.');
    if (c.intent === 'physical') out.push('Physical attack (punch / kick / charge): check eligibility, to-hit and damage in your rulebook (damage shown is an estimate).');
    if (c.inCover) out.push('Confirm the cover / terrain at the destination and its effect on line of sight and to-hit.');
    if (us.cbt.pilotHits > 0) out.push(`Pilot has ${us.cbt.pilotHits} hit(s): check consciousness rules if further damage occurs.`);
    return out;
  },
  unsupported: ['To-hit number calculation', 'Terrain MP costs, elevation and LOS', 'Facing-change MP costs and torso twist (arcs approximated)', 'Hit location, cluster hits and critical hits', 'Damage transfer and location destruction effects (tracked manually)', 'Heat scale effects (enter your own table)', 'Physical attack damage (estimate only)', 'Piloting Skill Rolls and falls'],
};
function adapterFor(rs) { return rs === 'as' ? RulesAdapterAlphaStrike : RulesAdapterClassic; }

/* --------------------------------------------- context / battle facts ---- */
const SoloContext = {
  /** Build the decision context and list missing information + assumptions. */
  build(s, actingId, st = Store.state) {
    const acting = BattleState.getUnit(s, actingId); const ad = adapterFor(s.ruleset);
    const ctx = { session: s, acting, adapter: ad, targets: [], excluded: [], missing: [], assumptions: [], errors: [], st };
    if (!acting) { ctx.errors.push('Select an enemy unit to act.'); return ctx; }
    if (!ad.profileOk(acting)) { ctx.errors.push(`${acting.name} has no ${RULESETS[s.ruleset].name} data.`); return ctx; }
    if (!BattleState.operational(acting)) { ctx.errors.push(`${acting.name} is ${acting.status} — it cannot act.`); return ctx; }
    const ac = s.ctx.acting[actingId] || {};
    ctx.actingCover = ac.cover || 'unknown'; ctx.terrainNote = ac.terrain || '';
    const unitWord = ad.unitWord; const losU = [], covU = [], distTxt = [];
    s.units.filter(u => u.side !== acting.side && BattleState.operational(u)).forEach(tu => {
      const pair = s.ctx.pairs[BattleState.pairKey(acting.id, tu.id)] || {};
      const mapD = BattleState.mapDistance(s, acting, tu, st);
      let dist = null, src = null;
      if (isNum(pair.dist)) { dist = pair.dist; src = 'manual'; } else if (mapD != null) { dist = mapD; src = 'map'; }
      const los = pair.los || 'unknown', cover = pair.cover || 'unknown';
      if (dist == null) { ctx.excluded.push(tu); ctx.missing.push({ key: 'dist', targetId: tu.id, q: `How far is ${tu.name} from ${acting.name} (in ${unitWord})? Place both on the map or type the distance.` }); return; }
      const t = { us: tu, dist, distSource: src, los, cover };
      if (s.ruleset === 'classic') { t.arcFromTarget = BattleState.arc(s, tu, acting); t.arcToTarget = BattleState.arc(s, acting, tu); }
      ctx.targets.push(t);
      if (los === 'unknown') losU.push(tu.label);
      if (cover === 'unknown') covU.push(tu.label);
      distTxt.push(`${tu.label} ${dist}${ad.unit}${src === 'map' ? ' (map)' : ' (typed)'}`);
    });
    if (distTxt.length) ctx.assumptions.push(`Distances: ${distTxt.join(', ')}.`);
    if (losU.length) ctx.assumptions.push(`Line of sight not confirmed to ${losU.join(', ')} — assumed possible but weighted down.`);
    if (covU.length) ctx.assumptions.push(`Target cover unknown for ${covU.join(', ')} — treated as uncertain.`);
    if (!ctx.targets.length && !ctx.excluded.length) ctx.errors.push('No operational friendly units to engage.');
    if (!ctx.targets.length && ctx.excluded.length) ctx.errors.push('At least one target distance is needed for a meaningful recommendation.');
    if (ctx.actingCover === 'unknown') ctx.assumptions.push('Unknown whether cover is reachable — “cover” options require you to confirm a covered position within movement range.');
    if (ctx.terrainNote) ctx.assumptions.push(`Terrain noted (“${ctx.terrainNote}”) but not simulated.`);
    ctx.assumptions.push(s.ruleset === 'as' ? 'Movement assumed in a straight line over clear terrain; other units\' distances shift by the same amount (approximation).' : 'Movement costs assume clear terrain (1 MP per hex, facing changes ignored); the unit ends facing its target; other distances shift by the same amount (approximation).');
    // objective
    const obj = s.scenario && s.scenario.objective;
    if (obj && isNum(obj.x) && BattleState.placed(acting)) {
      const fake = { pos: obj }; ctx.objectiveDist = BattleState.mapDistance(s, acting, fake, st);
    } else if (isNum(ac.objDist)) ctx.objectiveDist = ac.objDist;
    else ctx.objectiveDist = null;
    if (s.scenario && s.scenario.type !== 'standup' && ctx.objectiveDist == null) ctx.missing.push({ key: 'objDist', q: `How far is ${acting.name} from the objective (in ${unitWord})? (optional — set an objective point on the map or type it)` });
    if (s.ruleset === 'classic' && BattleState.placed(acting)) {
      const leg = ['LL', 'RL'].some(l => acting.cbt.internal[l] < acting.snapshot.classic.internal[l]);
      if (leg) ctx.assumptions.push('Leg internal damage recorded — movement reduction NOT applied automatically; verify available MP.');
    }
    return ctx;
  },
};

/* ------------------------------------------ CandidateActionGenerator ---- */
const CandidateActionGenerator = {
  INTENTS: { hold: 'Hold position', 'hold-cover': 'Hold position in cover', advance: 'Advance', close: 'Close in', flank: 'Flank', withdraw: 'Fall back', 'cover-advance': 'Advance to cover', 'cover-withdraw': 'Fall back to cover', objective: 'Move toward objective', physical: 'Close for a physical attack', 'cool-down': 'Hold fire and cool down' },
  generate(ctx, persona) {
    const { acting, adapter: ad, st } = ctx; const rs = ctx.session.ruleset; const out = [];
    const pref = ad.preferredDistance(acting, st);
    const moves = ad.moves(acting, st);
    const asOV = rs === 'as' && acting.snapshot.alphaStrike.ov > 0;
    const heatBudget = persona.heatBudget;
    const make = (t, intent, mode, mv, dest, moved, extra = {}) => {
      const r = rs === 'classic' ? v => Math.round(v) : v => U.round(v, 1);
      const c = Object.assign({ id: out.length + 1, target: t.us, targetCtx: t, intent, mode, mv, startDist: t.dist, dest: Math.max(rs === 'classic' ? 1 : 0.5, r(dest)), moved: Math.max(0, r(moved)), inCover: false, flank: false, notes: [], heatBudget }, extra);
      if (c.moved > mv) c.moved = mv;
      c.shift = c.dest - t.dist;
      out.push(c); return c;
    };
    ctx.targets.forEach(t => {
      const d = t.dist;
      // holds
      make(t, 'hold', 'hold', 0, d, 0, { inCover: ctx.actingCover === 'here' });
      if (ctx.actingCover === 'here') out[out.length - 1].intent = 'hold-cover';
      moves.forEach(m => {
        const mv = m.mv;
        if (d > pref.dist) make(t, 'advance', m.mode, mv, Math.max(d - mv, pref.dist), Math.min(mv, d - pref.dist));
        if (d - mv < pref.dist || d <= pref.dist) { const dest = Math.max(1, d - mv); if (dest < d) make(t, 'close', m.mode, mv, dest, d - dest); }
        make(t, 'withdraw', m.mode, mv, d + mv, mv);
        make(t, 'flank', m.mode, mv, Math.max(1, d - mv * 0.3), mv, { flank: rs === 'classic' && mv >= 3 && d <= mv * 2 });
        if (ctx.actingCover !== 'none') {
          const cm = mv * 0.6;
          if (d > pref.dist) make(t, 'cover-advance', m.mode, mv, Math.max(d - cm, pref.dist), Math.min(cm, d - pref.dist), { inCover: true, coverUnconfirmed: ctx.actingCover !== 'near' && ctx.actingCover !== 'here' });
          make(t, 'cover-withdraw', m.mode, mv, d + cm, cm, { inCover: true, coverUnconfirmed: ctx.actingCover !== 'near' && ctx.actingCover !== 'here' });
        }
        if (ctx.objectiveDist != null && ctx.objectiveDist > 0) make(t, 'objective', m.mode, mv, d, Math.min(mv, ctx.objectiveDist), { objProgress: Math.min(mv, ctx.objectiveDist) });
        if (d <= mv + 1 && m.mode !== 'jump') make(t, 'physical', m.mode, mv, rs === 'classic' ? 1 : 0.5, Math.max(0, d - 1));
      });
      if (rs === 'classic' && acting.cbt.heat > 0) make(t, 'cool-down', 'hold', 0, d, 0, { holdFire: true });
    });
    // expand AS overheat variants
    if (asOV) out.slice().forEach(c => { if (c.intent !== 'physical') { const v = Object.assign({}, c, { id: out.length + 1, overheat: true, notes: [] }); out.push(v); } });
    return out;
  },
};

/* ---------------------------------------------- ActionLegalityChecker ---- */
const ActionLegalityChecker = {
  /** Annotates candidates; returns only plausibly legal ones. Never claims verified legality. */
  check(cands, ctx) {
    const { acting, adapter: ad, st, session: s } = ctx; const keep = [];
    cands.forEach(c => {
      c.checks = [];
      if (c.moved > c.mv + 1e-9 && c.mode !== 'hold') { c.illegal = 'Exceeds available movement.'; return; }
      if (c.mode === 'jump' && !(c.mv > 0)) { c.illegal = 'No jump capability.'; return; }
      const t = c.targetCtx;
      c.moveHeat = s.ruleset === 'classic' ? ad.moveHeat(c.mode, c.moved, st) : 0;
      const mvAcc = (ad.moves(acting, st).find(m => m.mode === c.mode) || { acc: 1 }).acc;
      let losF = 1;
      if (t.los === 'no') { if (c.mode === 'hold') { c.noLOS = true; } else { losF = 0.5; c.checks.push(`LOS to ${t.us.name} is currently blocked — it may open after moving; confirm before firing.`); } }
      else if (t.los === 'unknown') losF = 0.8;
      const covF = st.settings.ai.coverFactor[t.cover] ?? 1;
      if (c.intent === 'physical') {
        const est = ad.physicalEstimate(acting);
        c.attack = { inRange: true, raw: est, expected: est * 0.6, heat: 0, ovUsed: 0, bandText: 'base contact', text: `physical attack on ${t.us.name} — estimated ${est} damage (estimate, not a rules calculation)`, weapons: [] };
        c.checks.push('Physical attack eligibility and damage must be checked in your rulebook.');
      } else if (c.noLOS) {
        c.attack = { inRange: false, raw: 0, expected: 0, heat: 0, ovUsed: 0, bandText: '—', text: `no attack — no line of sight to ${t.us.name}`, weapons: [] };
        if (s.ruleset === 'as' && (acting.snapshot.alphaStrike.specials || []).some(x => /^IF/.test(x))) c.checks.push('Unit has IF: indirect fire with a spotter may be possible — not simulated, resolve manually.');
      } else {
        c.attack = ad.attack(acting, t.us, c.dest, { overheat: !!c.overheat, acc: c.mode === 'hold' ? 1 : mvAcc, heatBudget: c.heatBudget, moveHeat: c.moveHeat, holdFire: !!c.holdFire }, st);
        c.attack.expected *= losF * covF;
      }
      if (c.overheat && !(c.attack && c.attack.ovUsed)) return; // overheat not usable here → drop duplicate
      if (s.ruleset === 'classic' && c.mode === 'hold' && t.arcToTarget && t.arcToTarget !== 'front') c.arcNote = `${t.us.name} appears outside the approximate front arc (${t.arcToTarget}) — torso twist / arm arcs may be required; verify which weapons can fire.`;
      if (c.arcNote) c.checks.push(c.arcNote);
      if (c.coverUnconfirmed) c.checks.push('Requires a covered position within movement range — confirm on the table.');
      if (c.flank) c.checks.push('Reaching the target\'s side/rear arc is plausible but not verified.');
      if (c.attack && c.attack.belowMin) c.checks.push('Minimum-range penalty applies to at least one weapon.');
      c.heat = ad.heatProjection(acting, c, st);
      c.legality = c.checks.length ? 'needs-check' : 'plausible';
      keep.push(c);
    });
    return keep;
  },
};

/* ---------------------------------------------------- TacticalScorer ---- */
const TacticalScorer = {
  FEATURES: ['damage', 'finishing', 'survival', 'evasion', 'position', 'mobility', 'objective'],
  weights(ai) {
    const p = PERSONALITIES[ai.personality] || PERSONALITIES.balanced; const pr = ai.priorities || {};
    const w = Object.assign({}, p.w);
    w.damage *= pr.damage ?? 1; w.finishing *= pr.damage ?? 1; w.survival *= pr.survival ?? 1; w.evasion *= pr.survival ?? 1;
    w.position *= pr.position ?? 1; w.mobility *= pr.position ?? 1; w.objective *= pr.objective ?? 1;
    return w;
  },
  score(cands, ctx, ai, rnd = null) {
    const { acting, adapter: ad, st } = ctx; const w = this.weights(ai); const risk = U.clamp(ai.risk ?? 0.5, 0, 1);
    const remaining = BattleState.remaining(acting);
    const survivalMul = (1 + 1.5 * (1 - remaining)) * (1.5 - risk);
    const maxMv = Math.max(1, ...ad.moves(acting, st).map(m => m.mv));
    // raw features
    cands.forEach(c => {
      const f = {};
      const tRem = BattleState.remaining(c.target);
      const tThreatNow = ad.threatAt(c.target, c.startDist, st);
      c.targetThreat = tThreatNow;
      f.damageRaw = c.attack ? c.attack.expected : 0;
      f.finishing = f.damageRaw > 0 ? Math.max(0, (0.5 - tRem) * 2) : 0;
      // incoming fire estimate from every operational opponent
      let incoming = 0, sources = 0;
      ctx.targets.forEach(o => {
        const od = Math.max(o === c.targetCtx ? c.dest : o.dist + c.shift, 0.5);
        const losF = o.los === 'no' ? 0.2 : o.los === 'unknown' ? 0.8 : 1;
        const thr = ad.threatAt(o.us, od, st) * losF;
        if (thr > 0) sources++;
        incoming += thr;
      });
      const evasion = c.mode === 'hold' ? 0 : Math.min(1, c.moved / maxMv) * 0.8 + (c.mode === 'jump' ? 0.2 : 0);
      const coverF = c.inCover ? (c.coverUnconfirmed ? 0.85 : 0.6) : 1;
      incoming *= coverF * (1 - 0.35 * evasion);
      c.incoming = incoming; c.incomingSources = sources;
      f.incomingRaw = incoming; f.evasion = evasion;
      f.position = Math.min(1, ad.positionScore(acting, c.dest, st)) + (c.inCover ? (c.coverUnconfirmed ? 0.08 : 0.25) : 0);
      const tPref = ad.preferredDistance(c.target, st).value;
      f.mobility = tPref > 0 ? Math.max(0, 1 - ad.threatAt(c.target, c.dest, st) / tPref) * (c.mode === 'hold' ? 0.5 : 1) * (f.damageRaw > 0 ? 1 : 0.3) : 0;
      f.objective = ctx.objectiveDist != null ? (c.intent === 'objective' ? (c.objProgress || 0) / Math.max(1, ctx.objectiveDist) : (ctx.objectiveDist <= 1 && c.mode === 'hold' ? 1 : 0)) : 0;
      // threat priority: prefer hitting units that hurt us most
      f.threatPriority = tThreatNow;
      c.f = f;
    });
    const maxD = Math.max(0, ...cands.map(c => c.f.damageRaw)), maxI = Math.max(0, ...cands.map(c => c.f.incomingRaw)), maxT = Math.max(0, ...cands.map(c => c.f.threatPriority));
    cands.forEach(c => {
      const f = c.f;
      f.damage = maxD > 0 ? (f.damageRaw / maxD) * (0.8 + 0.4 * (maxT > 0 ? f.threatPriority / maxT : 0)) : 0;
      f.survival = maxI > 0 ? 1 - f.incomingRaw / maxI : 1;
      const contrib = {
        damage: w.damage * f.damage, finishing: w.finishing * f.finishing, survival: w.survival * survivalMul * f.survival,
        evasion: w.evasion * f.evasion, position: w.position * f.position, mobility: w.mobility * f.mobility, objective: w.objective * f.objective,
      };
      let penalty = 0; const pen = [];
      if (c.heat) {
        if (c.heat.over > 0) { const p = Math.min(1, c.heat.over / 5) * 0.8; penalty += p; pen.push(['heat', p]); }
        if (c.heat.shutdownRisk) { penalty += 1; pen.push(['shutdown risk', 1]); }
        if (c.intent === 'cool-down' && c.heat.cur > 0) { const b = Math.min(0.6, c.heat.cur / 10); contrib.survival += b; }
      }
      const chk = (c.checks || []).length * 0.03; if (chk) { penalty += chk; pen.push(['unverified conditions', chk]); }
      c.contrib = contrib; c.penalties = pen;
      c.score = U.sum(Object.values(contrib)) - penalty;
    });
    if (rnd) { const maxS = Math.max(...cands.map(c => c.score), 0.01); const v = st.settings.ai.variance; cands.forEach(c => { c.noise = (rnd() - 0.5) * 2 * v * maxS; c.score += c.noise; }); }
    return cands.sort((a, b) => b.score - a.score);
  },
};

/* -------------------------------------------- RecommendationExplainer ---- */
const RecommendationExplainer = {
  headline(c, ctx) {
    const ad = ctx.adapter; const intent = CandidateActionGenerator.INTENTS[c.intent] || c.intent;
    const mv = c.mode === 'hold' ? '' : ` (${ad.modeText(c.mode, c.moved)})`;
    const rel = c.intent === 'hold' || c.intent === 'hold-cover' || c.intent === 'cool-down' ? '' : ` relative to ${c.target.name}`;
    const end = c.mode === 'hold' ? `staying ≈${ad.fmt(c.dest)} from ${c.target.name}` : `ending ≈${ad.fmt(c.dest)} from ${c.target.name}`;
    const atk = c.attack ? c.attack.text : 'no attack';
    return `${intent}${mv}${rel}, ${end}; ${c.overheat ? 'overheat and ' : ''}${atk}.`;
  },
  explain(ranked, ctx, idx = 0) {
    const c = ranked[idx]; if (!c) return null;
    const ad = ctx.adapter, st = ctx.st; const why = [], risks = [];
    const contribs = Object.entries(c.contrib).sort((a, b) => b[1] - a[1]);
    const maxD = Math.max(...ranked.map(x => x.attack ? x.attack.raw : 0));
    contribs.slice(0, 3).forEach(([k, v]) => {
      if (v <= 0.05) return;
      if (k === 'damage') why.push(c.attack && c.attack.raw >= maxD && maxD > 0 ? `Highest damage potential of the options considered (${c.attack.raw} at ${c.attack.bandText}).` : `Keeps up pressure: ${c.attack.raw} damage potential at ${c.attack.bandText}.`);
      if (k === 'survival') why.push(`Limits exposure — estimated return-fire potential ${U.round(c.incoming, 1)} from ${c.incomingSources} unit(s)${c.inCover ? ', using cover' : ''}.`);
      if (k === 'position') why.push(`Ends near its preferred engagement range (${ad.fmt(c.dest)}).`);
      if (k === 'finishing') why.push(`${c.target.name} is badly damaged (${Math.round(BattleState.remaining(c.target) * 100)}% left) — a chance to remove it.`);
      if (k === 'objective') why.push(`Makes progress toward the objective${ctx.objectiveDist != null ? ` (${U.round(c.objProgress || 0, 1)} of ${ctx.objectiveDist}${ad.unit})` : ''}.`);
      if (k === 'mobility') why.push(`Denies ${c.target.name} its best range (its potential drops to ${U.round(ad.threatAt(c.target, c.dest, st), 1)}).`);
      if (k === 'evasion') why.push(`Moving ${ad.fmt(c.moved)}${c.mode === 'jump' ? ' by jumping' : ''} makes it harder to hit (exact modifier per your rulebook).`);
    });
    if (!why.length) why.push('No option stands out; this one scores marginally best under the current personality.');
    if (c.f.survival < 0.5) risks.push(`Exposed: estimated return-fire potential ${U.round(c.incoming, 1)} (high relative to other options).`);
    if (!c.attack || !c.attack.inRange) risks.push('No damaging attack this turn.');
    const bestDmg = ranked.reduce((m, x) => Math.max(m, x.attack ? x.attack.raw : 0), 0);
    if (c.attack && bestDmg - c.attack.raw >= 1) risks.push(`Gives up ${U.round(bestDmg - c.attack.raw, 1)} damage potential compared with the most damaging option.`);
    if (c.heat && c.heat.over > 0) risks.push(`Heat: projected ${c.heat.proj} exceeds this personality's heat budget (${c.heat.budget}).`);
    if (c.heat && c.heat.shutdownRisk) risks.push('Shutdown risk from heat.');
    (c.checks || []).forEach(x => risks.push(x));
    const breakdown = TacticalScorer.FEATURES.map(k => ({ feature: k, value: k === 'damage' ? c.f.damage : c.f[k], contrib: c.contrib[k] }));
    return {
      candidateId: c.id, idx, headline: this.headline(c, ctx), why, risks, legality: c.legality,
      assumptions: ctx.assumptions.slice(), missing: ctx.missing.slice(),
      ruleChecks: ad.ruleChecks(c, ctx, st), unsupported: ad.unsupported.slice(), breakdown, penalties: c.penalties, score: c.score,
      heatInfo: c.heat || null, overheat: !!c.overheat, mode: c.mode, moved: c.moved, dest: c.dest, targetId: c.target.id, targetName: c.target.name,
      alternatives: ranked.filter((x, i) => i !== idx).slice(0, 4).map(x => ({ id: x.id, headline: this.headline(x, ctx), score: x.score, legality: x.legality })),
    };
  },
};

/* ------------------------------------------------------- SoloAssistant ---- */
const SoloAssistant = {
  /** Full pipeline. Returns { ok, errors, ctx, ranked, reco } */
  recommend(s, actingId, opts = {}, st = Store.state) {
    const ctx = SoloContext.build(s, actingId, st);
    if (ctx.errors.length) return { ok: false, errors: ctx.errors, ctx, ranked: [], reco: null };
    const persona = PERSONALITIES[s.ai.personality] || PERSONALITIES.balanced;
    let cands = CandidateActionGenerator.generate(ctx, persona);
    cands = ActionLegalityChecker.check(cands, ctx);
    if (!cands.length) return { ok: false, errors: ['No plausible action found with the current information.'], ctx, ranked: [], reco: null };
    const rnd = opts.reroll ? U.rng((s.seed || 1) + (opts.reroll || 0) * 7919) : null;
    const ranked = TacticalScorer.score(cands, ctx, s.ai, rnd);
    // collapse near-duplicates (same intent/mode/target/overheat) keeping the best
    const seen = new Set(); const uniq = ranked.filter(c => { const k = [c.intent, c.mode, c.target.id, !!c.overheat].join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
    const reco = RecommendationExplainer.explain(uniq, ctx, U.clamp(opts.index || 0, 0, uniq.length - 1));
    return { ok: true, errors: [], ctx, ranked: uniq, reco };
  },
};
</script>
<script>
'use strict';
/* ================================================================ UI ==== */
const VIEWS = [
  ['dashboard', 'nav.dashboard'], ['as', 'nav.as'], ['classic', 'nav.classic'], ['battle', 'nav.battle'],
  ['reference', 'nav.reference'], ['units', 'nav.units'], ['settings', 'nav.settings'], ['docs', 'nav.docs'],
];
const E = U.esc;
const opt = (v, label, sel) => `<option value="${E(v)}"${sel ? ' selected' : ''}>${E(label)}</option>`;
const rsBadge = rs => `<span class="rs-badge ${rs}" title="Active ruleset">${rs === 'as' ? '◆' : '⬢'} ${E(RULESETS[rs].name)}</span>`;
const SRC_TAG = { demo: ['demo', 'Fictional demo data'], original: ['original', 'Original summary'], 'user-owned': ['user', 'User-owned source'], user: ['user', 'User-entered'], licensed: ['official', 'Licensed / official (user-supplied)'], house: ['house', 'House rule'], calculated: ['calc', 'Calculated'] };
const contentTag = ct => { const [c, l] = SRC_TAG[ct] || ['', ct]; return `<span class="tag ${c}">${E(l)}</span>`; };
const dsById = id => Store.state.dataSources.find(d => d.id === id);

const UI = {
  tmp: {
    builderTab: { as: 'lib', classic: 'lib' }, battleTab: 'map', lib: { as: { q: '', wc: 'all', sort: 'name' }, classic: { q: '', wc: 'all', sort: 'name' } },
    ref: { q: '', rs: 'all', cat: 'all', type: 'all', fav: false, letter: '' }, openRef: {}, units: { q: '', rs: 'all', wc: 'all', src: 'all', sort: 'name' },
    compact: { as: false, classic: false }, explain: null, selectedUS: null, actingId: null, result: null, recoIdx: 0, reroll: 0,
    importAn: null, importMode: 'merge', tests: null, nb: null, placeObjective: false, dice: { tn: 8, last: null, log: false }, logTurn: 'all',
  },
  view() { return Store.state.ui.view || 'dashboard'; },
  goto(v) { Store.state.ui.view = v; Store.persistLocal(); this.render(); window.scrollTo(0, 0); },
  applyTheme() {
    const s = Store.state.settings; document.documentElement.dataset.theme = s.theme === 'light' ? 'light' : 'dark';
    document.documentElement.style.setProperty('--fs', Math.round(15 * (s.textScale || 1)) + 'px');
    document.documentElement.style.setProperty('--tap', s.largeTargets ? '48px' : '40px');
  },
  render() {
    const ae = document.activeElement; const focusId = ae && ae.id; let selS = null, selE = null;
    try { if (ae && 'selectionStart' in ae) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch (e) { }
    this.applyTheme(); this.renderNav(); this.renderStatus(); this.renderRulesetIndicator();
    const v = this.view(); const fn = Views[v] || Views.dashboard;
    let html; try { html = fn(); } catch (err) { console.error(err); html = `<div class="notice bad"><b>Something went wrong rendering this view.</b><br>${E(err.message)}<br>Your data is safe. Try another tab, or download a backup in Settings &amp; Data.</div>`; }
    document.getElementById('main').innerHTML = html;
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); try { if (selS != null) el.setSelectionRange(selS, selE); } catch (e) { } } }
  },
  renderNav() {
    const v = this.view();
    document.getElementById('nav').innerHTML = VIEWS.map(([id, k]) => `<button data-act="goto" data-view="${id}"${id === v ? ' aria-current="page"' : ''}>${E(t(k))}</button>`).join('');
  },
  renderStatus() {
    const pill = document.getElementById('savePill'); if (!pill) return; const s = Disk.status();
    pill.className = 'save-pill ' + s.cls; document.getElementById('saveText').textContent = s.text;
  },
  renderRulesetIndicator() {

  },
  toast(msg, kind = '') {
    const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg; el.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
    const box = document.getElementById('toasts'); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), kind === 'bad' ? 7000 : 3000);
  },
  /* ---- dialogs ---- */
  dlgRender: null,
  openDialog(renderFn) { this.dlgRender = renderFn; const d = document.getElementById('dlg'); d.innerHTML = renderFn(); if (!d.open) d.showModal(); },
  refreshDialog() { const d = document.getElementById('dlg'); if (d.open && this.dlgRender) { const sc = d.querySelector('.dlg-bd') ? d.querySelector('.dlg-bd').scrollTop : 0; d.innerHTML = this.dlgRender(); const b = d.querySelector('.dlg-bd'); if (b) b.scrollTop = sc; } },

  confirm(message, { okLabel = 'Confirm', danger = true, title = 'Please confirm' } = {}) {
    return new Promise(res => {

      d.innerHTML = `<div class="dlg-hd"><h2>${E(title)}</h2></div><div class="dlg-bd"><p>${E(message)}</p></div><div class="dlg-ft"><button value="no" data-c="0">Cancel</button><button class="${danger ? 'danger' : 'primary'}" data-c="1">${E(okLabel)}</button></div>`;
      const done = v => { d.close(); res(v); };
      d.querySelector('[data-c="0"]').onclick = () => done(false); d.querySelector('[data-c="1"]').onclick = () => done(true);
      d.oncancel = e => { e.preventDefault(); done(false); };
      d.showModal(); d.querySelector('[data-c="0"]').focus();

  },
  pickFile(accept, cb) {

    inp.click();
  },
  /** Load a full-backup text (used by Disk.openFile and fallback). */
  async loadBackupText(text, name) {

    if (obj.type !== 'mechops-backup' || !obj.state) { UI.tmp.importAn = Importer.analyze(obj); UI.tmp.importName = name; UI.goto('settings'); UI.toast('This file is not a full backup — review it in the import panel.'); return false; }
    const an = Importer.analyze(obj); const bad = an.items.filter(i => i.errors.length).length;
    if (an.fatal.length) { UI.toast(an.fatal.join(' '), 'bad'); return false; }
    const ok = await UI.confirm(`Load “${name}”? This replaces the data currently in the app (${Store.state.units.length} units, ${Store.state.forces.length} forces, ${Store.state.sessions.length} battles) with the file's content.${bad ? ` ${bad} invalid item(s) were found and will be kept but may not work.` : ''}`, { okLabel: 'Load file' });
    if (!ok) return false;
